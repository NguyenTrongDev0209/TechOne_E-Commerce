<!DOCTYPE html>
<html th:fragment="view(title, content)" class="light" lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title th:text="${title}">TechOne Auth</title>
    <link rel="shortcut icon" th:href="@{/images/TechOne_Favicon.png}" type="image/png">
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#fa4614",
                        "primary-hover": "#d6380e",
                        "background-light": "#f8f6f5",
                        "background-dark": "#23130f",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px" },
                },
            },
        }
    </script>
</head>

<body
    class="font-display bg-gradient-to-br from-[#fff0eb] to-background-light dark:from-[#2a1712] dark:to-background-dark min-h-screen text-[#1c100d] dark:text-white flex flex-col transition-colors duration-200">

    <header
        class="fixed top-0 left-0 right-0 z-50 flex items-center justify-between px-6 py-4 border-b border-gray-200/50 dark:border-white/10 bg-white/80 dark:bg-[#23130f]/80 backdrop-blur-md transition-all duration-300">
        <a th:href="@{/}" class="flex items-center gap-2.5 group">
            <img th:src="@{/images/TechOne_Logo.png}" alt="TechOne Logo"
                class="h-8 md:h-10 w-auto object-contain transition-transform duration-300 group-hover:scale-105" />
        </a>
        <a href="#"
            class="hidden sm:flex items-center gap-1 text-sm font-semibold text-gray-500 dark:text-gray-400 hover:text-primary dark:hover:text-primary transition-colors">
            <span class="material-symbols-outlined text-[18px]">help</span>
            <span>Trợ giúp</span>
        </a>
    </header>

    <div class="fixed inset-0 pointer-events-none overflow-hidden">
        <div class="absolute -top-[10%] -left-[10%] w-[50%] h-[50%] bg-primary/5 rounded-full blur-[120px]"></div>
        <div class="absolute -bottom-[10%] -right-[10%] w-[50%] h-[50%] bg-primary/5 rounded-full blur-[120px]"></div>
    </div>

    <main class="flex-grow flex flex-col items-center justify-center w-full px-4 pt-20 pb-10">
        <div class="w-full sm:max-w-[580px] relative z-10">
            <div
                class="bg-white dark:bg-[#2c1814] rounded-2xl shadow-[0_10px_40px_-10px_rgba(0,0,0,0.08)] p-6 sm:p-10 border border-white/50 dark:border-white/5 ring-1 ring-black/5 dark:ring-white/10 backdrop-blur-sm">

                <!-- Content replaces this div -->
                <div th:replace="${content}"></div>

            </div>
            <footer class="mt-8 text-center text-xs text-gray-400 dark:text-gray-500">
                © 2026 TechOne Inc. All rights reserved.
            </footer>
        </div>
    </main>

</body>

</html>
