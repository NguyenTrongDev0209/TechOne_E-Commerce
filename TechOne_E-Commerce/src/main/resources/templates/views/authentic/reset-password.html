<!DOCTYPE html>
<html th:replace="~{layouts/layout-authentic :: view(title='Đặt lại mật khẩu - TechShop', content=~{::content})}"
    xmlns:th="http://www.thymeleaf.org">
<div th:fragment="content">
    <div class="text-center mb-8">
        <h1 class="text-[#1c100d] dark:text-white text-2xl font-bold leading-tight mb-2">Đặt lại mật khẩu</h1>
        <p class="text-sm text-gray-500 dark:text-gray-400">
            Vui lòng nhập mật khẩu mới cho tài khoản của bạn.
        </p>
    </div>

    <div th:if="${error}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4"
        role="alert">
        <span class="block sm:inline" th:text="${error}"></span>
    </div>

    <form class="flex flex-col gap-5" th:action="@{/reset-password}" method="POST">
        <div class="flex flex-col gap-1.5">
            <label class="text-sm font-semibold text-[#1c100d] dark:text-[#e9d4ce]" for="password">Mật khẩu mới</label>
            <div class="relative group">
                <span
                    class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-primary transition-colors text-[20px]">lock</span>
                <input
                    class="w-full h-12 pl-11 pr-4 rounded-lg border border-[#e9d4ce] dark:border-gray-700 bg-gray-50 dark:bg-[#2a1712] text-[#1c100d] dark:text-white placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary focus:bg-white dark:focus:bg-[#2a1712] text-sm transition-all"
                    id="password" name="password" placeholder="••••••••" type="password" required />
            </div>
        </div>

        <div class="flex flex-col gap-1.5">
            <label class="text-sm font-semibold text-[#1c100d] dark:text-[#e9d4ce]" for="confirmPassword">Xác nhận mật
                khẩu</label>
            <div class="relative group">
                <span
                    class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-primary transition-colors text-[20px]">lock_reset</span>
                <input
                    class="w-full h-12 pl-11 pr-4 rounded-lg border border-[#e9d4ce] dark:border-gray-700 bg-gray-50 dark:bg-[#2a1712] text-[#1c100d] dark:text-white placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary focus:bg-white dark:focus:bg-[#2a1712] text-sm transition-all"
                    id="confirmPassword" name="confirmPassword" placeholder="••••••••" type="password" required />
            </div>
        </div>

        <button type="submit"
            class="w-full h-12 mt-2 bg-primary hover:bg-[#ff6b42] text-white font-bold rounded-lg shadow-lg shadow-primary/30 transition-all active:scale-[0.98] flex items-center justify-center gap-2">
            <span>Cập nhật mật khẩu</span>
            <span class="material-symbols-outlined text-[20px]">save</span>
        </button>
    </form>
</div>

</html>
