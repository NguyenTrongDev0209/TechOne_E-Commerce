<!DOCTYPE html>
<html th:replace="~{layouts/layout-authentic :: view(title='Đặt lại mật khẩu - TechShop', content=~{::content})}"
    xmlns:th="http://www.thymeleaf.org">
<div th:fragment="content">
    <div class="mb-8 text-center">
        <h1 class="text-2xl font-bold tracking-tight text-[#1c100d] dark:text-white mb-2">
            Đặt lại mật khẩu mới
        </h1>
        <p class="text-sm text-gray-500 dark:text-gray-400">
            Hãy tạo mật khẩu mới an toàn cho tài khoản của bạn.
        </p>
    </div>

    <div th:if="${error}" class="p-3 mb-4 text-sm text-red-800 rounded-lg bg-red-50 dark:bg-gray-800 dark:text-red-400"
        role="alert">
        <span th:text="${error}">Error message</span>
    </div>

    <form th:action="@{/reset-password}" class="flex flex-col gap-5" method="POST">
        <div class="flex flex-col gap-1.5">
            <label class="text-sm font-semibold text-[#1c100d] dark:text-[#e9d4ce]" for="password">Mật khẩu mới</label>
            <div class="relative group">
                <span
                    class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-primary transition-colors text-[20px]">lock</span>
                <input required
                    class="w-full h-12 pl-11 pr-12 rounded-lg border border-[#e9d4ce] dark:border-gray-700 bg-gray-50 dark:bg-[#2a1712] text-[#1c100d] dark:text-white placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary focus:bg-white dark:focus:bg-[#2a1712] text-sm transition-all"
                    id="password" name="password" placeholder="••••••••" type="password" />
            </div>
        </div>

        <div class="flex flex-col gap-1.5">
            <label class="text-sm font-semibold text-[#1c100d] dark:text-[#e9d4ce]" for="confirmPassword">Xác nhận mật
                khẩu</label>
            <div class="relative group">
                <span
                    class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-primary transition-colors text-[20px]">lock_reset</span>
                <input required
                    class="w-full h-12 pl-11 pr-12 rounded-lg border border-[#e9d4ce] dark:border-gray-700 bg-gray-50 dark:bg-[#2a1712] text-[#1c100d] dark:text-white placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary focus:bg-white dark:focus:bg-[#2a1712] text-sm transition-all"
                    id="confirmPassword" name="confirmPassword" placeholder="••••••••" type="password" />
            </div>
        </div>

        <button type="submit"
            class="w-full h-12 mt-2 bg-primary hover:bg-[#ff6b42] text-white font-bold rounded-lg shadow-lg shadow-primary/30 transition-all active:scale-[0.98] flex items-center justify-center gap-2">
            <span>Cập nhật mật khẩu</span>
            <span class="material-symbols-outlined text-[20px]">check_circle</span>
        </button>

        <div class="flex items-center justify-center pt-2">
            <a th:href="@{/login}"
                class="group flex items-center gap-2 text-gray-500 hover:text-primary transition-all text-sm font-bold">
                <span
                    class="material-symbols-outlined text-lg transition-transform group-hover:-translate-x-1">arrow_back</span>
                Quay lại đăng nhập
            </a>
        </div>
    </form>
</div>

</html>
