<!DOCTYPE html>
<html th:replace="~{layouts/layout-authentic :: view(title='Quên mật khẩu - TechShop', content=~{::content})}"
    xmlns:th="http://www.thymeleaf.org">
<div th:fragment="content">
    <input class="peer hidden" id="form-submitted" type="checkbox" />
    <div class="flex flex-col gap-6 peer-checked:hidden">
        <div class="text-center">
            <h1 class="text-[#1c100d] dark:text-white text-2xl font-bold leading-tight mb-2">Quên mật
                khẩu?</h1>
            <p class="text-sm text-gray-500 dark:text-gray-400">
                Nhập thông tin bên dưới để nhận liên kết đặt lại mật khẩu.
            </p>
        </div>
        <div th:if="${error}"
            class="p-3 mb-4 text-sm text-red-800 rounded-lg bg-red-50 dark:bg-gray-800 dark:text-red-400" role="alert">
            <span th:text="${error}">Error message</span>
        </div>
        <form class="flex flex-col gap-5" th:action="@{/forgot-password}" method="POST">
            <div class="flex flex-col gap-1.5">
                <label class="text-sm font-semibold text-[#1c100d] dark:text-[#e9d4ce]" id="input-label"
                    for="contact-input">Email</label>
                <div class="relative group">
                    <span id="input-icon"
                        class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-primary transition-colors text-[20px]">mail</span>
                    <input
                        class="w-full h-12 pl-11 pr-4 rounded-lg border border-[#e9d4ce] dark:border-gray-700 bg-gray-50 dark:bg-[#2a1712] text-[#1c100d] dark:text-white placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary focus:bg-white dark:focus:bg-[#2a1712] text-sm transition-all"
                        id="contact-input" name="email" placeholder="nguoidung@example.com" type="email" />
                </div>
            </div>

            <div class="flex items-center gap-4 mt-1">
                <span class="text-[#1c100d] dark:text-gray-200 text-sm font-semibold">Xác thực bằng:</span>
                <div class="flex gap-6 items-center">
                    <label class="flex items-center gap-2 cursor-pointer group">
                        <input type="radio" name="auth_method" value="email" checked
                            class="w-4 h-4 text-primary border-gray-300 focus:ring-primary cursor-pointer">
                        <span
                            class="text-sm font-medium text-gray-700 dark:text-gray-300 group-hover:text-primary transition-colors">Email</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer group">
                        <input type="radio" name="auth_method" value="phone"
                            class="w-4 h-4 text-primary border-gray-300 focus:ring-primary cursor-pointer">
                        <span
                            class="text-sm font-medium text-gray-700 dark:text-gray-300 group-hover:text-primary transition-colors">Số
                            điện thoại</span>
                    </label>
                </div>
            </div>

            <button type="submit"
                class="w-full h-12 mt-2 bg-primary hover:bg-[#ff6b42] text-white font-bold rounded-lg shadow-lg shadow-primary/30 transition-all active:scale-[0.98] flex items-center justify-center gap-2">
                <span>Gửi link đặt lại</span>
                <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
            </button>
        </form>
        <div class="flex items-center justify-center pt-2">
            <a th:href="@{/login}"
                class="group flex items-center gap-2 text-gray-500 hover:text-primary transition-all text-sm font-bold">
                <span
                    class="material-symbols-outlined text-lg transition-transform group-hover:-translate-x-1">arrow_back</span>
                Quay lại đăng nhập
            </a>
        </div>
    </div>
    <!-- Correct state -->
    <div class="hidden peer-checked:flex flex-col gap-6 items-center text-center">
        <div class="flex h-20 w-20 items-center justify-center rounded-full bg-primary/10">
            <span class="material-symbols-outlined text-5xl text-primary">check</span>
        </div>
        <div class="flex flex-col gap-2">
            <h1 class="text-[#1c100d] dark:text-white text-2xl font-bold leading-tight">Kiểm tra hộp thư
            </h1>
            <p class="text-sm text-gray-500 dark:text-gray-400">
                Chúng tôi đã gửi link đặt lại mật khẩu đến <span class="font-semibold text-[#1c100d] dark:text-white"
                    id="sent-contact">email@example.com</span>.
            </p>
        </div>
        <div class="flex w-full flex-col gap-4 pt-2">
            <a th:href="@{/login}"
                class="flex w-full items-center justify-center overflow-hidden rounded-xl h-12 px-5 border-2 border-primary text-primary hover:bg-primary hover:text-white transition-all text-base font-bold leading-normal tracking-[0.015em]">
                Quay lại đăng nhập
            </a>
            <button class="text-sm font-semibold text-primary transition-colors hover:text-[#ff6434] hover:underline"
                onclick="document.getElementById('form-submitted').checked = false;">
                Thử lại
            </button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const methodRadios = document.querySelectorAll('input[name="auth_method"]');
            const inputLabel = document.getElementById('input-label');
            const inputIcon = document.getElementById('input-icon');
            const contactInput = document.getElementById('contact-input');
            const sentContact = document.getElementById('sent-contact');

            function updateInput(method) {
                if (method === 'email') {
                    inputLabel.textContent = 'Email';
                    inputIcon.textContent = 'mail';
                    contactInput.type = 'email';
                    contactInput.placeholder = 'nguoidung@example.com';
                } else {
                    inputLabel.textContent = 'Số điện thoại';
                    inputIcon.textContent = 'call';
                    contactInput.type = 'tel';
                    contactInput.placeholder = '090 123 4567';
                }
            }

            methodRadios.forEach(radio => {
                radio.addEventListener('change', function () {
                    if (this.checked) {
                        updateInput(this.value);
                    }
                });
            });

            // Handle form submission purely for demo visual update
            const form = document.querySelector('form');
            form.addEventListener('submit', function () {
                sentContact.textContent = contactInput.value || (contactInput.type === 'email' ? 'email@example.com' : '090 123 4567');
            });
        });
    </script>
</div>

</html>
