<!DOCTYPE html>
<html th:replace="~{layouts/layout-authentic :: view(title='Đăng nhập - TechShop', content=~{::content})}"
    xmlns:th="http://www.thymeleaf.org">
<div th:fragment="content">
    <div class="text-center mb-8">
        <h1 class="text-2xl font-bold leading-tight tracking-tight text-[#1c100d] dark:text-white mb-2">
            Chào mừng quay lại
        </h1>
        <p class="text-sm text-gray-500 dark:text-gray-400">
            Vui lòng nhập thông tin đăng nhập của bạn
        </p>
    </div>
    <form th:action="@{/}" class="flex flex-col gap-5" method="GET" id="loginForm">
        <div class="flex flex-col gap-1.5">
            <label class="text-sm font-semibold text-[#1c100d] dark:text-[#e9d4ce]" for="email">Email hoặc
                số điện thoại</label>
            <div class="relative group">
                <span
                    class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-primary transition-colors text-[20px]">account_circle</span>
                <input
                    class="w-full h-12 pl-11 pr-4 rounded-lg border border-[#e9d4ce] dark:border-gray-700 bg-gray-50 dark:bg-[#2a1712] text-[#1c100d] dark:text-white placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary focus:bg-white dark:focus:bg-[#2a1712] text-sm transition-all"
                    id="email" placeholder="name@example.com" type="text" />
            </div>
        </div>
        <div class="flex flex-col gap-1.5">
            <label class="text-sm font-semibold text-[#1c100d] dark:text-[#e9d4ce]" for="password">Mật
                khẩu</label>
            <div class="relative group">
                <span
                    class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-primary transition-colors text-[20px]">lock</span>
                <input
                    class="w-full h-12 pl-11 pr-12 rounded-lg border border-[#e9d4ce] dark:border-gray-700 bg-gray-50 dark:bg-[#2a1712] text-[#1c100d] dark:text-white placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary focus:bg-white dark:focus:bg-[#2a1712] text-sm transition-all"
                    id="password" placeholder="••••••••" type="password" />
                <button
                    class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-primary transition-colors flex items-center justify-center focus:outline-none"
                    id="togglePassword" type="button">
                    <span class="material-symbols-outlined text-[20px]">visibility_off</span>
                </button>
            </div>
        </div>
        <div class="flex flex-wrap items-center justify-between gap-y-2 mt-1">
            <label class="flex items-center gap-2 cursor-pointer group">
                <div class="relative flex items-center">
                    <input
                        class="peer size-5 cursor-pointer appearance-none rounded border border-gray-300 dark:border-gray-600 checked:bg-primary checked:border-primary transition-all bg-white dark:bg-transparent"
                        type="checkbox" />
                    <span
                        class="material-symbols-outlined absolute text-white opacity-0 peer-checked:opacity-100 top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 pointer-events-none text-[16px]">check</span>
                </div>
                <span
                    class="text-gray-600 dark:text-gray-300 text-sm font-medium group-hover:text-primary transition-colors">Ghi
                    nhớ đăng nhập</span>
            </label>
            <a th:href="@{/forgot-password}"
                class="text-primary hover:text-primary-hover text-sm font-semibold transition-colors">Quên
                mật khẩu?</a>
        </div>
        <button id="loginButton"
            class="w-full h-12 mt-2 bg-primary hover:bg-[#ff6b42] text-white font-bold rounded-lg shadow-lg shadow-primary/30 transition-all active:scale-[0.98] flex items-center justify-center gap-2 disabled:opacity-70 disabled:cursor-not-allowed">
            <svg class="animate-spin -ml-1 mr-2 h-5 w-5 text-white hidden" id="loginSpinner"
                xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
                </circle>
                <path class="opacity-75" fill="currentColor"
                    d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                </path>
            </svg>
            <span id="loginButtonText">Đăng nhập</span>
            <span id="loginButtonIcon" class="material-symbols-outlined text-[20px]">arrow_forward</span>
        </button>
    </form>
    <div class="relative flex py-6 items-center">
        <div class="flex-grow border-t border-gray-100 dark:border-[#5a3a32]"></div>
        <span
            class="flex-shrink-0 mx-4 text-xs text-gray-400 dark:text-gray-500 font-medium uppercase tracking-wider">Hoặc
            tiếp tục với</span>
        <div class="flex-grow border-t border-gray-100 dark:border-[#5a3a32]"></div>
    </div>
    <div class="grid grid-cols-1 gap-3">
        <button
            class="flex items-center justify-center gap-3 h-12 rounded-lg border border-gray-200 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-white/5 hover:border-gray-400 dark:hover:border-gray-500 hover:shadow-md transition-all font-medium text-sm text-[#1c100d] dark:text-white bg-white dark:bg-transparent w-full">
            <svg class="size-5" fill="none" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path
                    d="M21.8055 10.0415H21V10H12V14H17.6515C16.827 16.3285 14.6115 18 12 18C8.6865 18 6 15.3135 6 12C6 8.6865 8.6865 6 12 6C13.5295 6 14.921 6.577 15.9805 7.5195L18.809 4.691C17.023 3.0265 14.634 2 12 2C6.4775 2 2 6.4775 2 12C2 17.5225 6.4775 22 12 22C17.5225 22 22 17.5225 22 12C22 11.3295 21.931 10.675 21.8055 10.0415Z"
                    fill="#FFC107"></path>
                <path
                    d="M3.15295 7.3455L6.43845 9.755C7.32745 7.554 9.48045 6 12 6C13.5295 6 14.921 6.577 15.9805 7.5195L18.809 4.691C17.023 3.0265 14.634 2 12 2C8.15895 2 4.82795 4.1685 3.15295 7.3455Z"
                    fill="#FF3D00"></path>
                <path
                    d="M12 22C14.6605 22 17.0715 20.9455 18.8585 19.245L15.8285 16.6395C14.7355 17.5025 13.4355 18 12 18C9.36295 18 7.12945 16.3015 6.30845 13.9395L3.06445 16.427C4.73545 19.7435 8.11795 22 12 22Z"
                    fill="#4CAF50"></path>
                <path
                    d="M21.8055 10.0415H21V10H12V14H17.6515C17.257 15.108 16.6205 16.039 15.8285 16.6395L18.8585 19.245C20.673 17.564 21.685 15.2285 21.9365 12.7755C21.979 12.3535 22 11.921 22 11.4885C22 10.9985 21.935 10.514 21.8055 10.0415Z"
                    fill="#1976D2"></path>
            </svg>
            Google
        </button>
    </div>
    <div class="mt-8 text-center">
        <p class="text-sm text-gray-600 dark:text-gray-400">
            Chưa có tài khoản?
            <a th:href="@{/register}" class="font-bold text-primary hover:text-primary-hover transition-colors">Đăng ký
                ngay</a>
        </p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // Password Show/Hide Logic
            const togglePasswordBtn = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('password');

            if (togglePasswordBtn && passwordInput) {
                togglePasswordBtn.addEventListener('click', function () {
                    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                    passwordInput.setAttribute('type', type);

                    const icon = this.querySelector('.material-symbols-outlined');
                    if (icon) {
                        icon.textContent = type === 'password' ? 'visibility_off' : 'visibility';
                    }
                });
            }

            // Loading State Logic
            const loginForm = document.getElementById('loginForm');
            const loginButton = document.getElementById('loginButton');
            const loginSpinner = document.getElementById('loginSpinner');
            const loginButtonText = document.getElementById('loginButtonText');
            const loginButtonIcon = document.getElementById('loginButtonIcon');

            if (loginForm) {
                loginForm.addEventListener('submit', function (e) {
                    // e.preventDefault(); // Remove this in real app if standard submission
                    // For demo purposes, we'll let it submit but show the loading state

                    // Show loading
                    loginButton.disabled = true;
                    loginSpinner.classList.remove('hidden');
                    loginButtonIcon.classList.add('hidden');
                    loginButtonText.textContent = 'Đang xử lý...';

                    // If simple navigation fake, setTimeout to restore (optional)
                    // setTimeout(() => {
                    //     loginButton.disabled = false;
                    //     loginSpinner.classList.add('hidden');
                    //     loginButtonIcon.classList.remove('hidden');
                    //     loginButtonText.textContent = 'Đăng nhập';
                    // }, 2000);
                });
            }
        });
    </script>
</div>

</html>
