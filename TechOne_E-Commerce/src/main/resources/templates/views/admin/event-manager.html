<!DOCTYPE html>
<html
    th:replace="~{layouts/layout-admin :: view(title='Quản lý sự kiện', menuItem='events', content=~{:: #main-content}, subMenuItem=null)}">

<body>
    <div id="main-content">
        <div class="max-w-7xl mx-auto space-y-6">
            <!-- Header -->
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div>
                    <h1 class="text-3xl font-bold text-gray-900 dark:text-white tracking-tight">Sự kiện & Flash Sale
                    </h1>
                    <p class="text-gray-500 dark:text-gray-400 font-body mt-1">Quản lý các chương trình khuyến mãi sự
                        kiện và Flash Sale</p>
                </div>
                <button
                    class="flex items-center gap-2 bg-primary hover:bg-orange-700 text-white px-5 py-2.5 rounded-xl text-sm font-bold transition-all shadow-lg shadow-orange-900/20">
                    <span class="material-symbols-outlined text-[20px]">add</span>
                    Tạo Sự kiện mới
                </button>
            </div>

            <!-- Tabs -->
            <div class="border-b border-gray-200 dark:border-gray-700">
                <nav class="-mb-px flex space-x-8" aria-label="Tabs">
                    <button onclick="switchTab('flash-sale')" id="tab-flash-sale"
                        class="tab-btn border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300 whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm transition-colors active-tab">
                        Flash Sale
                    </button>
                    <button onclick="switchTab('events')" id="tab-events"
                        class="tab-btn border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300 whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm transition-colors">
                        Sự kiện
                    </button>
                </nav>
            </div>

            <!-- Content Area -->
            <div id="content-flash-sale" class="tab-content block">
                <div
                    class="bg-white dark:bg-[#1e293b] rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 p-6">
                    <div class="flex items-center justify-center p-12 text-gray-500 flex-col gap-4">
                        <span class="material-symbols-outlined text-6xl text-gray-300">flash_on</span>
                        <p class="text-lg font-medium">Danh sách Flash Sale sẽ hiển thị ở đây</p>
                    </div>
                </div>
            </div>

            <div id="content-events" class="tab-content hidden">
                <div
                    class="bg-white dark:bg-[#1e293b] rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 p-6">
                    <div class="flex items-center justify-center p-12 text-gray-500 flex-col gap-4">
                        <span class="material-symbols-outlined text-6xl text-gray-300">event</span>
                        <p class="text-lg font-medium">Danh sách Sự kiện sẽ hiển thị ở đây</p>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        function switchTab(tabName) {
            // Hide all contents
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('block'));

            // Show selected content
            document.getElementById('content-' + tabName).classList.remove('hidden');
            document.getElementById('content-' + tabName).classList.add('block');

            // Update tab styles
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('border-primary', 'text-primary');
                btn.classList.add('border-transparent', 'text-gray-500');
            });

            const activeBtn = document.getElementById('tab-' + tabName);
            activeBtn.classList.remove('border-transparent', 'text-gray-500');
            activeBtn.classList.add('border-primary', 'text-primary');
        }

        // Initialize default tab (Flash Sale)
        document.addEventListener('DOMContentLoaded', () => {
            switchTab('flash-sale');
        });
    </script>
</body>

</html>
