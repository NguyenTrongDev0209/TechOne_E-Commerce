<!DOCTYPE html>
<html
    th:replace="~{layouts/layout-account :: view(title='Danh sách yêu thích', activeTab='wishlist', accountContent=~{:: #wishlist-content})}">

<body>

    <div id="wishlist-content">

        <div class="mb-6 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold text-[#1c100d] dark:text-white">Danh sách yêu thích</h1>
                <p class="text-sm text-gray-500 mt-1">Đang hiển thị các sản phẩm bạn đã yêu thích</p>
            </div>
        </div>

        <!-- Empty State -->
        <div th:if="${favouritePage != null and favouritePage.content.isEmpty()}"
            class="flex flex-col items-center justify-center py-16 bg-white dark:bg-[#1e293b] rounded-xl border border-gray-100 dark:border-gray-700 shadow-sm">
            <div class="size-32 bg-gray-50 dark:bg-[#2a1a15] rounded-full flex items-center justify-center mb-6">
                <span class="material-symbols-outlined text-gray-300 text-6xl">favorite_border</span>
            </div>
            <h3 class="text-xl font-bold text-[#1c100d] dark:text-white mb-2">Danh sách yêu thích trống</h3>
            <p class="text-gray-500 dark:text-gray-400 text-center max-w-md mb-8">
                Bạn chưa thêm sản phẩm nào vào danh sách yêu thích hoặc sản phẩm đã hết hàng. Hãy khám phá thêm nhé!
            </p>
            <a href="/categories"
                class="bg-primary hover:bg-orange-600 text-white font-bold py-3 px-8 rounded-lg transition-colors shadow-lg shadow-orange-500/30">
                Khám phá sản phẩm
            </a>
        </div>

        <!-- Favourite List -->
        <div th:if="${favouritePage != null and !favouritePage.content.isEmpty()}"
            class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-4 md:gap-6">

            <div th:each="favourite : ${favouritePage.content}"
                class="bg-white dark:bg-[#1e293b] rounded-xl shadow-sm border border-transparent dark:border-gray-700 hover:border-primary hover:shadow-md transition-all duration-300 group/card">
                <div class="relative w-full aspect-square bg-gray-100 dark:bg-gray-800 rounded-t-xl overflow-hidden">
                    <span th:if="${favourite.variant.discount > 0}"
                        class="absolute top-2 left-2 bg-primary text-white text-xs font-bold px-2 py-1 rounded z-10"
                        th:text="'-' + ${#numbers.formatDecimal(favourite.variant.discount, 0, 0)} + '%'">-15%</span>

                    <button th:onclick="'toggleFavorite(' + ${favourite.variant.id} + ', this)'"
                        class="absolute top-2 right-2 z-10 size-8 rounded-full bg-white/80 dark:bg-black/50 backdrop-blur-sm flex items-center justify-center shadow-sm text-red-500 hover:bg-white dark:hover:bg-gray-800 transition-all group/fav"
                        title="Xóa khỏi yêu thích">
                        <span class="material-symbols-outlined text-[20px] text-red-500"
                            style="font-variation-settings: 'FILL' 1">favorite</span>
                    </button>

                    <a th:href="@{'/product/product-detail/' + ${favourite.variant.product.slug}}">
                        <img th:if="${!favourite.variant.variantImages.isEmpty()}"
                            th:src="@{'/images/variants/' + ${favourite.variant.variantImages[0].pathImage}}"
                            class="w-full h-full object-cover group-hover/card:scale-105 transition-transform duration-500"
                            alt="Product Image" />
                        <img th:unless="${!favourite.variant.variantImages.isEmpty()}"
                            src="https://via.placeholder.com/400"
                            class="w-full h-full object-cover group-hover/card:scale-105 transition-transform duration-500"
                            alt="Placeholder" />
                    </a>
                </div>
                <div class="p-4 flex flex-col gap-2">
                    <span th:if="${favourite.variant.product.brand != null}"
                        class="bg-gray-100 dark:bg-gray-700 text-gray-500 dark:text-gray-400 text-[10px] font-bold px-2.5 py-0.5 rounded-full w-fit uppercase"
                        th:text="${favourite.variant.product.brand.name}">Brand</span>

                    <a th:href="@{'/product/product-detail/' + ${favourite.variant.product.slug}}">
                        <h4 class="text-[#1c100d] dark:text-white font-semibold line-clamp-2 min-h-[2.5rem] group-hover/card:text-primary transition-colors text-sm"
                            th:text="${favourite.variant.product.name}">
                            Product Name
                        </h4>
                    </a>

                    <p class="text-[11px] text-gray-400" th:text="${favourite.variant.sku}">SKU</p>

                    <div class="flex items-end justify-between mt-1">
                        <div class="flex flex-col">
                            <span th:if="${favourite.variant.discount > 0}"
                                class="text-gray-400 dark:text-gray-500 text-xs line-through font-medium"
                                th:text="${#numbers.formatDecimal(favourite.variant.price, 0, 'COMMA', 0, 'POINT')} + '₫'">0₫</span>
                            <span class="text-primary font-bold"
                                th:text="${#numbers.formatDecimal(favourite.variant.price * (100 - favourite.variant.discount) / 100, 0, 'COMMA', 0, 'POINT')} + '₫'">0₫</span>
                        </div>
                        <button th:onclick="'addToCartDirectly(' + ${favourite.variant.id} + ')'"
                            class="size-9 rounded-lg bg-orange-600 text-white flex items-center justify-center hover:bg-orange-700 transition-all shadow-lg"
                            title="Thêm vào giỏ hàng">
                            <span class="material-symbols-outlined text-[20px]">add_shopping_cart</span>
                        </button>
                    </div>
                </div>
            </div>

        </div>

        <!-- Pagination -->
        <div th:if="${favouritePage != null and favouritePage.totalPages > 1}" class="mt-8 flex justify-center">
            <nav class="flex items-center gap-2">
                <a th:href="@{/account/favourited(page=${currentPage - 1})}"
                    th:classappend="${currentPage == 0} ? 'pointer-events-none opacity-50' : ''"
                    class="size-10 flex items-center justify-center rounded-lg border border-gray-100 dark:border-gray-700 text-gray-500 hover:bg-gray-50 dark:hover:bg-gray-800">
                    <span class="material-symbols-outlined">chevron_left</span>
                </a>

                <th:block th:each="i : ${#numbers.sequence(0, favouritePage.totalPages - 1)}">
                    <a th:href="@{/account/favourited(page=${i})}" th:text="${i + 1}"
                        th:classappend="${currentPage == i} ? 'bg-primary text-white font-bold' : 'border-gray-100 dark:border-gray-700 text-[#1c100d] dark:text-white hover:bg-gray-50 dark:hover:bg-gray-800 font-medium'"
                        class="size-10 flex items-center justify-center rounded-lg border">1</a>
                </th:block>

                <a th:href="@{/account/favourited(page=${currentPage + 1})}"
                    th:classappend="${currentPage + 1 >= favouritePage.totalPages} ? 'pointer-events-none opacity-50' : ''"
                    class="size-10 flex items-center justify-center rounded-lg border border-gray-100 dark:border-gray-700 text-gray-500 hover:bg-gray-50 dark:hover:bg-gray-800">
                    <span class="material-symbols-outlined">chevron_right</span>
                </a>
            </nav>
        </div>

        <script>
            // Need addToCartDirectly here if not in layout-client.html
            async function addToCartDirectly(variantId) {
                try {
                    const response = await fetch('/api/cart/add', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ variantId: parseInt(variantId), quantity: 1 })
                    });

                    if (response.ok) {
                        const data = await response.json();
                        Swal.fire({
                            icon: 'success',
                            title: 'Đã thêm vào giỏ',
                            text: 'Sản phẩm đã có trong giỏ hàng của bạn',
                            showConfirmButton: false,
                            timer: 1500
                        });

                        const cartBadge = document.getElementById('cart-count-badge');
                        if (cartBadge) {
                            cartBadge.innerText = data.cartCount;
                            cartBadge.classList.remove('hidden');
                        }
                    } else if (response.status === 401) {
                        Swal.fire({
                            icon: 'warning',
                            title: 'Yêu cầu đăng nhập',
                            text: 'Vui lòng đăng nhập để thực hiện chức năng này',
                            confirmButtonText: 'Đăng nhập',
                            showCancelButton: true
                        }).then((result) => {
                            if (result.isConfirmed) window.location.href = '/login';
                        });
                    } else {
                        const text = await response.text();
                        Swal.fire({ icon: 'error', title: 'Thất bại', text: text || 'Có lỗi xảy ra' });
                    }
                } catch (e) {
                    console.error(e);
                }
            }
        </script>
    </div>
</body>

</html>
