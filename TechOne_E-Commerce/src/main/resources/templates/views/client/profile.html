<!DOCTYPE html>
<html
    th:replace="~{layouts/layout-account :: view(title='Thông tin tài khoản', activeTab='profile', accountContent=~{:: #profile-content})}">

<body>

    <div id="profile-content">

        <div class="mb-6 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-[#1c100d] dark:text-white">Thông tin tài khoản</h1>
            <span class="text-sm text-gray-500">Cập nhật lần cuối: 24/05/2024</span>
        </div>

        <div
            class="bg-white dark:bg-[#1e293b] rounded-xl border border-gray-100 dark:border-gray-700 p-6 lg:p-10 shadow-sm">
            <div class="flex flex-col md:flex-row gap-10">

                <div
                    class="flex flex-col items-center gap-4 md:min-w-[240px] md:border-r border-gray-100 dark:border-gray-700 pr-0 md:pr-10">
                    <div class="relative group">
                        <div
                            class="size-32 rounded-full overflow-hidden border-4 border-gray-50 dark:border-gray-800 shadow-sm">
                            <img alt="Large user avatar" class="w-full h-full object-cover"
                                th:src="${session.user.avatar != null ? session.user.avatar : 'https://ui-avatars.com/api/?name=' + session.user.fullname + '&background=random&size=256'}" />
                        </div>
                    </div>
                    <button
                        class="w-full px-4 py-2 border border-primary text-primary rounded-lg font-medium hover:bg-primary/5 transition-colors text-sm flex items-center justify-center gap-2">
                        <span class="material-symbols-outlined text-[18px]">photo_camera</span>
                        Thay đổi ảnh
                    </button>
                    <div class="text-center">
                        <p class="text-xs text-gray-400">Dung lượng file tối đa 1 MB</p>
                        <p class="text-xs text-gray-400">Định dạng: .JPEG, .PNG</p>
                    </div>
                </div>

                <div class="flex-1 w-full">
                    <form action="#">
                        <div class="grid grid-cols-1 gap-6 mb-8">
                            <h3
                                class="text-lg font-bold text-[#1c100d] dark:text-white border-b border-gray-100 dark:border-gray-700 pb-2">
                                Thông tin cá nhân</h3>

                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div class="md:col-span-2">
                                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Họ và
                                        tên</label>
                                    <input
                                        class="w-full rounded-lg border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-800 text-gray-900 dark:text-white focus:border-primary focus:ring-primary"
                                        type="text" th:value="${session.user.fullname}" value="Nguyen Van A" />
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Ngày
                                        sinh</label>
                                    <input
                                        class="w-full rounded-lg border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-800 text-gray-900 dark:text-white focus:border-primary focus:ring-primary"
                                        type="date" value="1995-10-20" />
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Giới
                                        tính</label>
                                    <div class="flex gap-6 h-[42px] items-center">
                                        <label class="inline-flex items-center cursor-pointer">
                                            <input checked=""
                                                class="form-radio text-primary focus:ring-primary h-4 w-4 bg-gray-50 dark:bg-gray-800 border-gray-300 dark:border-gray-600"
                                                name="gender" type="radio" value="male" />
                                            <span class="ml-2 text-gray-700 dark:text-gray-300">Nam</span>
                                        </label>
                                        <label class="inline-flex items-center cursor-pointer">
                                            <input
                                                class="form-radio text-primary focus:ring-primary h-4 w-4 bg-gray-50 dark:bg-gray-800 border-gray-300 dark:border-gray-600"
                                                name="gender" type="radio" value="female" />
                                            <span class="ml-2 text-gray-700 dark:text-gray-300">Nữ</span>
                                        </label>
                                    </div>
                                </div>
                            </div>

                            <h3
                                class="text-lg font-bold text-[#1c100d] dark:text-white border-b border-gray-100 dark:border-gray-700 pb-2 mt-2">
                                Thông tin liên hệ & Xác minh</h3>

                            <div class="space-y-4">
                                <div class="flex flex-col sm:flex-row gap-4 items-start sm:items-end">
                                    <div class="flex-1 w-full">
                                        <label
                                            class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Email</label>
                                        <div class="relative">
                                            <input
                                                class="w-full rounded-lg border-gray-300 dark:border-gray-600 bg-gray-200 dark:bg-gray-700 text-gray-500 dark:text-gray-400 cursor-not-allowed pr-10"
                                                disabled="" type="email" th:value="${session.user.email}"
                                                value="nguyenvana@example.com" />
                                            <span
                                                class="absolute right-3 top-2.5 text-gray-400 material-symbols-outlined text-[20px]">lock</span>
                                        </div>
                                    </div>
                                    <div class="w-full sm:w-auto pb-1">
                                        <div
                                            class="inline-flex items-center gap-1.5 px-3 py-2 rounded-lg bg-green-50 text-green-700 border border-green-200 dark:bg-green-900/20 dark:text-green-400 dark:border-green-800">
                                            <span class="material-symbols-outlined text-[18px]">verified_user</span>
                                            <span class="text-sm font-bold">Đã xác thực</span>
                                        </div>
                                    </div>
                                </div>

                                <div class="flex flex-col sm:flex-row gap-4 items-start sm:items-end">
                                    <div class="flex-1 w-full">
                                        <label
                                            class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Số
                                            điện thoại</label>
                                        <input
                                            class="w-full rounded-lg border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-800 text-gray-900 dark:text-white focus:border-primary focus:ring-primary"
                                            type="tel" th:value="${session.user.phone}" value="0912345678" />
                                    </div>
                                    <div class="w-full sm:w-auto">
                                        <button
                                            class="w-full sm:w-auto h-[42px] px-4 rounded-lg bg-yellow-50 text-yellow-700 border border-yellow-200 hover:bg-yellow-100 transition-colors dark:bg-yellow-900/20 dark:text-yellow-400 dark:border-yellow-800 text-sm font-bold flex items-center justify-center gap-1.5"
                                            type="button">
                                            <span class="material-symbols-outlined text-[18px]">sms</span>
                                            Gửi mã xác minh
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="pt-6 border-t border-gray-100 dark:border-gray-700 flex justify-end">
                            <button
                                class="w-full sm:w-auto bg-primary hover:bg-orange-600 text-white font-bold py-3 px-10 rounded-lg transition-all shadow-lg shadow-orange-500/30 flex items-center justify-center gap-2"
                                type="button">
                                <span class="material-symbols-outlined">save</span>
                                Lưu thay đổi
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

    </div>
</body>

</html>
