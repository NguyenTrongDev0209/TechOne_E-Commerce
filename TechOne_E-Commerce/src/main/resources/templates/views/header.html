<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<header th:fragment="header" class="h-16 bg-surface-light/80 backdrop-blur-md border-b border-slate-100 flex items-center justify-between px-6 sticky top-0 z-10">
    <button class="lg:hidden p-2 -ml-2 text-slate-500 hover:text-slate-900">
        <span class="material-symbols-outlined">menu</span>
    </button>
    <div class="flex-1 max-w-lg hidden md:block">
        <div class="relative group">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-primary transition-colors material-symbols-outlined text-[20px]">search</span>
            <input class="w-full bg-slate-50 border-none rounded-xl py-2 pl-10 pr-4 text-sm focus:ring-2 focus:ring-primary/20 focus:bg-white transition-all placeholder:text-slate-400" placeholder="Tìm kiếm đơn hàng, sản phẩm..." type="text"/>
        </div>
    </div>
    <div class="flex items-center gap-4 ml-auto">
        <button class="relative p-2 text-slate-500 hover:bg-slate-50 rounded-xl hover:text-primary transition-colors">
            <span class="material-symbols-outlined">notifications</span>
            <span class="absolute top-2 right-2.5 w-2 h-2 bg-primary rounded-full border-2 border-white"></span>
        </button>
        <div class="h-8 w-px bg-slate-200 mx-1"></div>
        <button class="flex items-center gap-2 text-sm font-semibold text-slate-600 hover:text-primary transition-colors">
            <span class="material-symbols-outlined">help</span>
            <span class="hidden sm:inline">Trợ giúp</span>
        </button>
    </div>
</header>
</html>
