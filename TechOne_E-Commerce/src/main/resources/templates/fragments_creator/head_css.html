<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head_css">
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Noto+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config" th:inline="javascript">
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "primary": "#FF4500", "bg-main": "#FFFFFF", "bg-sidebar": "#F8F9FA",
                        "card-surface": "#FFFFFF", "border-subtle": "#E9ECEF",
                        "text-main": "#212529", "text-muted": "#6C757D",
                    },
                    fontFamily: { "display": ["Space Grotesk", "sans-serif"], "body": ["Noto Sans", "sans-serif"] }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: #dee2e6; border-radius: 4px; }
        .editor-content:empty:before { content: attr(placeholder); color: #9CA3AF; }
    </style>
</head>
</html>
