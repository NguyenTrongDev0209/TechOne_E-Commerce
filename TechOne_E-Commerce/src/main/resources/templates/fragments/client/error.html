<!DOCTYPE html>
<html th:replace="~{layouts/layout-client :: view(title='404 Không tìm thấy trang', content=~{:: #error-content})}">
<body>

    <div id="error-content" class="w-full bg-background-light dark:bg-background-dark min-h-screen flex flex-col items-center justify-center relative overflow-hidden">
        
        <main class="flex-grow flex flex-col items-center justify-center px-4 py-12 relative w-full z-10">
            <div class="absolute top-1/4 left-1/4 w-64 h-64 bg-primary/5 rounded-full blur-3xl -z-10"></div>
            <div class="absolute bottom-1/4 right-1/4 w-80 h-80 bg-blue-500/5 rounded-full blur-3xl -z-10"></div>
            
            <div class="max-w-4xl w-full flex flex-col items-center text-center gap-8 z-10">
                <div class="relative w-full flex justify-center items-center py-6">
                    <h1 class="absolute text-[160px] md:text-[240px] font-black text-primary/5 select-none leading-none z-0">404</h1>
                    
                    <div class="relative z-10 w-64 h-64 md:w-80 md:h-80 bg-cover bg-center rounded-2xl shadow-sm overflow-hidden" 
                         style='background-image: url("https://images.unsplash.com/photo-1594322436404-5a0526db4d13?auto=format&fit=crop&q=80&w=600");'>
                         <div class="absolute inset-0 bg-gradient-to-t from-background-light/50 to-transparent dark:from-background-dark/50"></div>
                    </div>
                </div>

                <div class="space-y-4 max-w-2xl">
                    <h2 class="text-3xl md:text-5xl font-bold text-text-main dark:text-white tracking-tight">
                        <span class="text-primary">Oops!</span> Trang bạn tìm không tồn tại
                    </h2>
                    <p class="text-text-secondary dark:text-gray-400 text-lg font-normal leading-relaxed">
                        Có thể link bị lỗi hoặc trang đã bị di chuyển. Đừng lo, bạn vẫn có thể khám phá nhiều deal hot!
                    </p>
                </div>

                <div class="w-full max-w-xl">
                    <form class="relative group" action="/search" method="get">
                        <div class="absolute inset-y-0 left-0 pl-5 flex items-center pointer-events-none">
                            <span class="material-symbols-outlined text-primary text-2xl group-focus-within:text-primary-hover transition-colors">search</span>
                        </div>
                        <input name="keyword" class="block w-full pl-14 pr-24 py-5 rounded-2xl bg-white dark:bg-white/5 border border-transparent shadow-[0_4px_20px_rgba(0,0,0,0.03)] dark:shadow-none text-text-main dark:text-white placeholder-text-secondary/60 dark:placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all text-lg" placeholder="Tìm kiếm sản phẩm..." type="text"/>
                        <button class="absolute inset-y-2 right-2 px-6 bg-primary hover:bg-primary-hover text-white font-medium rounded-xl transition-colors shadow-lg shadow-primary/20" type="submit">
                            Tìm
                        </button>
                    </form>
                </div>

                <div class="flex flex-col sm:flex-row gap-4 w-full justify-center pt-2">
                    <a th:href="@{/}" class="flex items-center justify-center gap-2 px-8 py-4 bg-primary hover:bg-primary-hover text-white rounded-xl font-bold text-base transition-all shadow-lg shadow-primary/25 hover:shadow-primary/40 transform hover:-translate-y-0.5">
                        <span class="material-symbols-outlined text-[20px]">home</span>
                        Quay về trang chủ
                    </a>
                    <a href="#" class="flex items-center justify-center gap-2 px-8 py-4 bg-white dark:bg-white/5 border border-gray-200 dark:border-white/10 hover:border-primary/50 hover:bg-primary/5 text-text-main dark:text-white rounded-xl font-bold text-base transition-all transform hover:-translate-y-0.5">
                        <span class="material-symbols-outlined text-[20px] text-primary">local_fire_department</span>
                        Xem khuyến mãi đang hot
                    </a>
                </div>

                <div class="flex flex-wrap justify-center items-center gap-x-6 gap-y-2 text-sm text-text-secondary dark:text-gray-400 pt-4 border-t border-gray-100 dark:border-white/5 w-full max-w-lg mt-4">
                    <span class="font-semibold text-text-main dark:text-gray-300">Phổ biến:</span>
                    <a class="hover:text-primary transition-colors underline decoration-transparent hover:decoration-primary underline-offset-4" href="#">Laptop</a>
                    <a class="hover:text-primary transition-colors underline decoration-transparent hover:decoration-primary underline-offset-4" href="#">Smartphone</a>
                    <a class="hover:text-primary transition-colors underline decoration-transparent hover:decoration-primary underline-offset-4" href="#">Phụ kiện</a>
                </div>
            </div>
        </main>

    </div>
</body>
</html>
