<!DOCTYPE html>
<html class="light" lang="vi">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Đăng nhập - TechShop</title>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#fa4614",
                        "primary-hover": "#d6380e",
                        "background-light": "#f8f6f5",
                        "background-dark": "#23130f",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                },
            },
        }
    </script>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-[#1c100d] dark:text-[#fcf9f8] antialiased min-h-screen flex flex-col items-center relative overflow-hidden">
    
    <header class="fixed top-0 left-0 right-0 z-50 flex items-center justify-between px-6 py-4 border-b border-gray-200/50 dark:border-white/10 bg-white/80 dark:bg-[#23130f]/80 backdrop-blur-md transition-all duration-300">
        <a th:href="@{/}" class="flex items-center gap-2.5 group">
            <img th:src="@{/images/TechOne_Logo.png}" alt="TechOne Logo" class="h-8 md:h-10 w-auto object-contain transition-transform duration-300 group-hover:scale-105"/>
            <h2 class="text-2xl font-black tracking-tighter text-gray-900 dark:text-white">TechShop</h2>
        </a>
        <a href="#" class="hidden sm:flex items-center gap-1 text-sm font-semibold text-gray-500 dark:text-gray-400 hover:text-primary dark:hover:text-primary transition-colors">
            <span class="material-symbols-outlined text-[18px]">help</span>
            <span>Trợ giúp</span>
        </a>
    </header>
    <div class="fixed inset-0 pointer-events-none overflow-hidden">
        <div class="absolute -top-[10%] -left-[10%] w-[50%] h-[50%] bg-primary/5 rounded-full blur-[120px]"></div>
        <div class="absolute -bottom-[10%] -right-[10%] w-[50%] h-[50%] bg-primary/5 rounded-full blur-[120px]"></div>
    </div>

    <main class="flex-1 flex items-center justify-center w-full px-4 pt-20">
        <div class="w-full max-w-[440px] relative z-10">
            <div class="bg-white dark:bg-[#2c1814] rounded-2xl shadow-[0_10px_40px_-10px_rgba(0,0,0,0.08)] p-6 sm:p-10 border border-white/50 dark:border-white/5 ring-1 ring-black/5 dark:ring-white/10 backdrop-blur-sm">
                <div class="text-center mb-8">
                    <h1 class="text-[#1c100d] dark:text-white tracking-tight text-2xl sm:text-3xl font-bold leading-tight mb-2">
                        Chào mừng quay lại
                    </h1>
                    <p class="text-sm text-gray-500 dark:text-gray-400">
                        Vui lòng nhập thông tin đăng nhập của bạn
                    </p>
                </div>
                <form th:action="@{/}" class="flex flex-col gap-5" method="GET">
                    <div class="flex flex-col gap-1.5">
                        <label class="text-sm font-semibold text-[#1c100d] dark:text-[#e9d4ce]" for="email">Email hoặc số điện thoại</label>
                        <input class="w-full rounded-xl text-[#1c100d] dark:text-white border border-gray-200 dark:border-[#5a3a32] bg-gray-50 dark:bg-[#1a0f0d] focus:border-primary focus:ring-2 focus:ring-primary/20 h-11 px-4 placeholder:text-gray-400 dark:placeholder:text-gray-600 text-sm transition-all" id="email" placeholder="name@example.com" type="text"/>
                    </div>
                    <div class="flex flex-col gap-1.5">
                        <label class="text-sm font-semibold text-[#1c100d] dark:text-[#e9d4ce]" for="password">Mật khẩu</label>
                        <div class="relative flex w-full items-center">
                            <input class="w-full rounded-xl text-[#1c100d] dark:text-white border border-gray-200 dark:border-[#5a3a32] bg-gray-50 dark:bg-[#1a0f0d] focus:border-primary focus:ring-2 focus:ring-primary/20 h-11 pl-4 pr-12 placeholder:text-gray-400 dark:placeholder:text-gray-600 text-sm transition-all" id="password" placeholder="••••••••" type="password"/>
                            <button class="absolute right-0 top-0 h-full px-3 text-gray-400 dark:text-gray-500 hover:text-primary transition-colors flex items-center justify-center rounded-r-xl focus:outline-none" type="button">
                                <span class="material-symbols-outlined" style="font-size: 20px;">visibility</span>
                            </button>
                        </div>
                    </div>
                    <div class="flex flex-wrap items-center justify-between gap-y-2 mt-1">
                        <label class="flex items-center gap-2 cursor-pointer group">
                            <div class="relative flex items-center">
                                <input class="peer h-4 w-4 rounded border-gray-300 dark:border-[#5a3a32] bg-white dark:bg-[#1a0f0d] text-primary checked:bg-primary focus:ring-0 focus:ring-offset-0 transition-all cursor-pointer" type="checkbox"/>
                            </div>
                            <span class="text-gray-600 dark:text-gray-300 text-sm font-medium group-hover:text-primary transition-colors">Ghi nhớ đăng nhập</span>
                        </label>
                        <a th:href="@{/forgot-password}" class="text-primary hover:text-primary-hover text-sm font-semibold transition-colors">Quên mật khẩu?</a>
                    </div>
                    <button class="w-full bg-primary hover:bg-primary-hover text-white h-11 rounded-xl font-bold text-sm transition-all transform active:scale-[0.98] shadow-lg shadow-primary/20 mt-2 flex items-center justify-center gap-2">
                        Đăng nhập
                    </button>
                </form>
                <div class="relative flex py-6 items-center">
                    <div class="flex-grow border-t border-gray-100 dark:border-[#5a3a32]"></div>
                    <span class="flex-shrink-0 mx-4 text-xs text-gray-400 dark:text-gray-500 font-medium uppercase tracking-wider">Hoặc tiếp tục với</span>
                    <div class="flex-grow border-t border-gray-100 dark:border-[#5a3a32]"></div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <button class="flex items-center justify-center gap-2 h-10 rounded-xl border border-gray-200 dark:border-[#5a3a32] bg-white dark:bg-[#1a0f0d] hover:bg-gray-50 dark:hover:bg-[#2c1814] transition-colors text-[#1c100d] dark:text-[#e9d4ce] font-semibold text-sm hover:shadow-sm">
                        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path d="M23.766 12.2764C23.766 11.4607 23.6999 10.6406 23.5588 9.83807H12.24V14.4591H18.7217C18.4528 15.9494 17.5885 17.2678 16.323 18.1056V21.1039H20.19C22.4608 19.0139 23.766 15.9274 23.766 12.2764Z" fill="#4285F4"></path>
                            <path d="M12.2401 24.0008C15.4766 24.0008 18.2059 22.9382 20.1945 21.1039L16.3275 18.1055C15.2517 18.8375 13.8627 19.252 12.2445 19.252C9.11388 19.252 6.45946 17.1399 5.50705 14.3003H1.5166V17.3912C3.55371 21.4434 7.7029 24.0008 12.2401 24.0008Z" fill="#34A853"></path>
                            <path d="M5.50253 14.3003C5.00236 12.8099 5.00236 11.1961 5.50253 9.70575V6.61481H1.51649C-0.18551 10.0056 -0.18551 14.0004 1.51649 17.3912L5.50253 14.3003Z" fill="#FBBC05"></path>
                            <path d="M12.2401 4.74966C13.9509 4.7232 15.6044 5.36697 16.8434 6.54867L20.2695 3.12262C18.1001 1.0855 15.2208 -0.034466 12.2401 0.000808666C7.7029 0.000808666 3.55371 2.55822 1.5166 6.61481L5.50264 9.70575C6.45064 6.86173 9.10947 4.74966 12.2401 4.74966Z" fill="#EA4335"></path>
                        </svg>
                        Google
                    </button>
                    <button class="flex items-center justify-center gap-2 h-10 rounded-xl border border-gray-200 dark:border-[#5a3a32] bg-white dark:bg-[#1a0f0d] hover:bg-gray-50 dark:hover:bg-[#2c1814] transition-colors text-[#1c100d] dark:text-[#e9d4ce] font-semibold text-sm hover:shadow-sm">
                        <svg class="w-5 h-5 text-[#1877F2]" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"></path>
                        </svg>
                        Facebook
                    </button>
                </div>
                <div class="mt-8 text-center">
                    <p class="text-sm text-gray-600 dark:text-gray-400">
                        Chưa có tài khoản? 
                        <a th:href="@{/register}" class="font-bold text-primary hover:text-primary-hover transition-colors">Đăng ký ngay</a>
                    </p>
                    <div class="mt-8 flex justify-center gap-6 text-xs text-gray-400 dark:text-gray-600">
                        <a class="hover:text-primary transition-colors" href="#">Điều khoản</a>
                        <a class="hover:text-primary transition-colors" href="#">Bảo mật</a>
                        <a class="hover:text-primary transition-colors" href="#">Hỗ trợ</a>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
