<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head_css">
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
          tailwind.config = {
            darkMode: "class",
            theme: {
              extend: {
                colors: { "primary": "#ff4400", "background-light": "#f8f6f5", "background-dark": "#23140f", "surface-light": "#ffffff" },
                fontFamily: { "display": ["Space Grotesk", "sans-serif"], "body": ["Noto Sans", "sans-serif"] },
                borderRadius: { "DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "2xl": "2rem" },
                boxShadow: { 'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)' }
              },
            },
          }
    </script>
    <style>
        /* Thêm các CSS custom như .conic-chart ở đây */
        .conic-chart { background: conic-gradient(#ff4400 0% 40%, #ff8844 40% 65%, #22c55e 65% 85%, #e5e7eb 85% 100%); border-radius: 50%; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-thumb { background: #e5e7eb; border-radius: 4px; }
    </style>
</head>
</html>
