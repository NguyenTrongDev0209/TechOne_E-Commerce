<!DOCTYPE html>
<html class="light" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Trang Đăng ký TechShop</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&amp;family=Noto+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#fa4614",
                        "background-light": "#f8f6f5",
                        "background-dark": "#23130f",
                    },
                    fontFamily: {
                        "display": ["Inter", "Noto Sans", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                },
            },
        }
    </script>
</head>
<body class="font-display bg-gradient-to-br from-[#fff0eb] to-background-light dark:from-[#2a1712] dark:to-background-dark min-h-screen text-[#1c100d] dark:text-white flex flex-col transition-colors duration-200">
<header class="fixed top-0 left-0 w-full bg-white/80 dark:bg-[#1c100d]/80 backdrop-blur-md border-b border-gray-100 dark:border-white/10 z-50 h-16 flex items-center px-4 sm:px-8">
<div class="flex items-center gap-2">
<div class="size-8 text-primary">
<svg class="w-full h-full" fill="currentColor" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
<path d="M4 42.4379C4 42.4379 14.0962 36.0744 24 41.1692C35.0664 46.8624 44 42.2078 44 42.2078L44 7.01134C44 7.01134 35.068 11.6577 24.0031 5.96913C14.0971 0.876274 4 7.27094 4 7.27094L4 42.4379Z"></path>
</svg>
</div>
<h2 class="text-xl font-black text-[#1c100d] dark:text-white tracking-tight">TechShop</h2>
</div>
</header>
<main class="flex-grow flex flex-col justify-center py-24 sm:px-6 lg:px-8">
<div class="sm:mx-auto sm:w-full sm:max-w-md flex flex-col items-center mb-8">
</div>
<div class="sm:mx-auto sm:w-full sm:max-w-[580px]">
<div class="bg-white dark:bg-[#1c100d] py-10 px-6 shadow-xl shadow-primary/5 rounded-lg sm:px-10 border border-[#e9d4ce]/30 dark:border-white/5 relative">
<div class="mb-8 text-center">
<h1 class="text-2xl font-bold leading-tight tracking-tight text-[#1c100d] dark:text-white mb-2">Tạo tài khoản TechShop</h1>
<p class="text-sm text-gray-500 dark:text-gray-400">Điền thông tin bên dưới để bắt đầu</p>
</div>
<form class="flex flex-col gap-5">
<div class="flex flex-col gap-1.5">
<label class="text-[#1c100d] dark:text-gray-200 text-sm font-semibold">Tên đăng nhập</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-primary transition-colors text-[20px]">account_circle</span>
<input class="w-full h-12 pl-11 pr-4 rounded-lg border border-[#e9d4ce] dark:border-gray-700 bg-gray-50 dark:bg-[#2a1712] text-[#1c100d] dark:text-white placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary focus:bg-white dark:focus:bg-[#2a1712] text-sm transition-all" placeholder="Tên đăng nhập của bạn" type="text"/>
</div>
</div>
<div class="flex flex-col gap-1.5">
<label class="text-[#1c100d] dark:text-gray-200 text-sm font-semibold">Họ và tên</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-primary transition-colors text-[20px]">person</span>
<input class="w-full h-12 pl-11 pr-4 rounded-lg border border-[#e9d4ce] dark:border-gray-700 bg-gray-50 dark:bg-[#2a1712] text-[#1c100d] dark:text-white placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary focus:bg-white dark:focus:bg-[#2a1712] text-sm transition-all" placeholder="Nguyễn Văn A" type="text"/>
</div>
</div>
<div class="flex flex-col gap-1.5">
<label class="text-[#1c100d] dark:text-gray-200 text-sm font-semibold">Email</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-primary transition-colors text-[20px]">mail</span>
<input class="w-full h-12 pl-11 pr-4 rounded-lg border border-[#e9d4ce] dark:border-gray-700 bg-gray-50 dark:bg-[#2a1712] text-[#1c100d] dark:text-white placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary focus:bg-white dark:focus:bg-[#2a1712] text-sm transition-all" placeholder="email@example.com" type="email"/>
</div>
</div>
<div class="flex flex-col gap-1.5">
<label class="text-[#1c100d] dark:text-gray-200 text-sm font-semibold">Số điện thoại</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-primary transition-colors text-[20px]">call</span>
<input class="w-full h-12 pl-11 pr-4 rounded-lg border border-[#e9d4ce] dark:border-gray-700 bg-gray-50 dark:bg-[#2a1712] text-[#1c100d] dark:text-white placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary focus:bg-white dark:focus:bg-[#2a1712] text-sm transition-all" placeholder="090 123 4567" type="tel"/>
</div>
</div>
<div class="grid grid-cols-12 gap-4">
<div class="col-span-12 sm:col-span-7 flex flex-col gap-1.5">
<label class="text-[#1c100d] dark:text-gray-200 text-sm font-semibold">Giới tính</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-primary transition-colors text-[20px]">wc</span>
<div class="w-full h-12 pl-11 pr-2 rounded-lg border border-[#e9d4ce] dark:border-gray-700 bg-gray-50 dark:bg-[#2a1712] flex items-center justify-between sm:justify-start sm:gap-6">
<label class="flex items-center gap-1.5 cursor-pointer group/radio">
<input class="size-4 text-primary border-gray-300 dark:border-gray-600 focus:ring-primary bg-white dark:bg-transparent cursor-pointer transition-all" name="gender" type="radio" value="male"/>
<span class="text-sm text-[#1c100d] dark:text-white font-medium group-hover/radio:text-primary transition-colors">Nam</span>
</label>
<label class="flex items-center gap-1.5 cursor-pointer group/radio">
<input class="size-4 text-primary border-gray-300 dark:border-gray-600 focus:ring-primary bg-white dark:bg-transparent cursor-pointer transition-all" name="gender" type="radio" value="female"/>
<span class="text-sm text-[#1c100d] dark:text-white font-medium group-hover/radio:text-primary transition-colors">Nữ</span>
</label>
<label class="flex items-center gap-1.5 cursor-pointer group/radio">
<input class="size-4 text-primary border-gray-300 dark:border-gray-600 focus:ring-primary bg-white dark:bg-transparent cursor-pointer transition-all" name="gender" type="radio" value="other"/>
<span class="text-sm text-[#1c100d] dark:text-white font-medium group-hover/radio:text-primary transition-colors">Khác</span>
</label>
</div>
</div>
</div>
<div class="col-span-12 sm:col-span-5 flex flex-col gap-1.5">
<label class="text-[#1c100d] dark:text-gray-200 text-sm font-semibold">Ngày sinh</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-primary transition-colors text-[20px]">calendar_today</span>
<input class="w-full h-12 pl-11 pr-4 rounded-lg border border-[#e9d4ce] dark:border-gray-700 bg-gray-50 dark:bg-[#2a1712] text-[#1c100d] dark:text-white placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary focus:bg-white dark:focus:bg-[#2a1712] text-sm transition-all" type="date"/>
</div>
</div>
</div>
<div class="flex flex-col gap-1.5">
<label class="text-[#1c100d] dark:text-gray-200 text-sm font-semibold">Mật khẩu</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-primary transition-colors text-[20px]">lock</span>
<input class="w-full h-12 pl-11 pr-12 rounded-lg border border-[#e9d4ce] dark:border-gray-700 bg-gray-50 dark:bg-[#2a1712] text-[#1c100d] dark:text-white placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary focus:bg-white dark:focus:bg-[#2a1712] text-sm transition-all" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-primary transition-colors flex items-center justify-center" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
<div class="flex gap-1 mt-1 h-1 w-full">
<div class="h-full w-1/4 rounded-full bg-primary"></div>
<div class="h-full w-1/4 rounded-full bg-gray-200 dark:bg-gray-700"></div>
<div class="h-full w-1/4 rounded-full bg-gray-200 dark:bg-gray-700"></div>
<div class="h-full w-1/4 rounded-full bg-gray-200 dark:bg-gray-700"></div>
</div>
<span class="text-xs text-primary font-medium mt-0.5">Mật khẩu yếu</span>
</div>
<div class="flex flex-col gap-1.5">
<label class="text-[#1c100d] dark:text-gray-200 text-sm font-semibold">Xác nhận mật khẩu</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-primary transition-colors text-[20px]">verified_user</span>
<input class="w-full h-12 pl-11 pr-4 rounded-lg border border-[#e9d4ce] dark:border-gray-700 bg-gray-50 dark:bg-[#2a1712] text-[#1c100d] dark:text-white placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary focus:bg-white dark:focus:bg-[#2a1712] text-sm transition-all" placeholder="••••••••" type="password"/>
</div>
</div>
<label class="flex items-start gap-3 cursor-pointer mt-2 group">
<div class="relative flex items-center pt-0.5">
<input class="peer size-5 cursor-pointer appearance-none rounded border border-gray-300 dark:border-gray-600 checked:bg-primary checked:border-primary transition-all bg-white dark:bg-transparent" type="checkbox"/>
<span class="material-symbols-outlined absolute text-white opacity-0 peer-checked:opacity-100 top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 pointer-events-none text-[16px]">check</span>
</div>
<span class="text-sm text-gray-600 dark:text-gray-300 leading-tight">
                        Tôi đồng ý với <a class="text-primary hover:text-[#d63a0e] hover:underline font-medium transition-colors" href="#">Điều khoản dịch vụ</a> và <a class="text-primary hover:text-[#d63a0e] hover:underline font-medium transition-colors" href="#">Chính sách bảo mật</a>
</span>
</label>
<button class="w-full h-12 mt-2 bg-primary hover:bg-[#ff6b42] text-white font-bold rounded-lg shadow-lg shadow-primary/30 transition-all active:scale-[0.98] flex items-center justify-center gap-2">
<span>Đăng ký</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<div class="relative flex py-8 items-center">
<div class="flex-grow border-t border-gray-200 dark:border-gray-700"></div>
<span class="flex-shrink-0 mx-4 text-gray-400 text-xs uppercase font-semibold tracking-wider">Hoặc đăng ký bằng</span>
<div class="flex-grow border-t border-gray-200 dark:border-gray-700"></div>
</div>
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-3 h-12 rounded-lg border border-gray-200 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-white/5 hover:border-gray-400 dark:hover:border-gray-500 hover:shadow-md transition-all font-medium text-sm text-[#1c100d] dark:text-white bg-white dark:bg-transparent">
<svg class="size-5" fill="none" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M21.8055 10.0415H21V10H12V14H17.6515C16.827 16.3285 14.6115 18 12 18C8.6865 18 6 15.3135 6 12C6 8.6865 8.6865 6 12 6C13.5295 6 14.921 6.577 15.9805 7.5195L18.809 4.691C17.023 3.0265 14.634 2 12 2C6.4775 2 2 6.4775 2 12C2 17.5225 6.4775 22 12 22C17.5225 22 22 17.5225 22 12C22 11.3295 21.931 10.675 21.8055 10.0415Z" fill="#FFC107"></path>
<path d="M3.15295 7.3455L6.43845 9.755C7.32745 7.554 9.48045 6 12 6C13.5295 6 14.921 6.577 15.9805 7.5195L18.809 4.691C17.023 3.0265 14.634 2 12 2C8.15895 2 4.82795 4.1685 3.15295 7.3455Z" fill="#FF3D00"></path>
<path d="M12 22C14.6605 22 17.0715 20.9455 18.8585 19.245L15.8285 16.6395C14.7355 17.5025 13.4355 18 12 18C9.36295 18 7.12945 16.3015 6.30845 13.9395L3.06445 16.427C4.73545 19.7435 8.11795 22 12 22Z" fill="#4CAF50"></path>
<path d="M21.8055 10.0415H21V10H12V14H17.6515C17.257 15.108 16.6205 16.039 15.8285 16.6395L18.8585 19.245C20.673 17.564 21.685 15.2285 21.9365 12.7755C21.979 12.3535 22 11.921 22 11.4885C22 10.9985 21.935 10.514 21.8055 10.0415Z" fill="#1976D2"></path>
</svg>
                    Google
                </button>
<button class="flex items-center justify-center gap-3 h-12 rounded-lg border border-gray-200 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-white/5 hover:border-gray-400 dark:hover:border-gray-500 hover:shadow-md transition-all font-medium text-sm text-[#1c100d] dark:text-white bg-white dark:bg-transparent">
<svg class="size-6 text-[#1877F2]" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22 12.0632C22 6.50257 17.5229 2 12 2C6.47715 2 2 6.50257 2 12.0632C2 17.0877 5.66318 21.2464 10.4375 21.9961V14.9688H7.89844V12.0632H10.4375V9.85157C10.4375 7.34812 11.9305 5.96289 14.2146 5.96289C15.3088 5.96289 16.4531 6.1582 16.4531 6.1582V8.61719H15.1922C13.95 8.61719 13.5625 9.38787 13.5625 10.1777V12.0632H16.3359L15.8926 14.9688H13.5625V21.9961C18.3368 21.2464 22 17.0877 22 12.0632Z"></path>
</svg>
                    Facebook
                </button>
</div>
<div class="mt-8 text-center">
<p class="text-sm text-gray-500 dark:text-gray-400">
                    Đã có tài khoản?
                    <a class="text-primary font-bold hover:text-[#d63a0e] hover:underline transition-colors" href="#">Đăng nhập</a>
</p>
</div>
</div>
<footer class="mt-8 text-center text-xs text-gray-400 dark:text-gray-500">
            © 2024 TechShop Inc. All rights reserved.
        </footer>
</div>
</main>

</body></html>
