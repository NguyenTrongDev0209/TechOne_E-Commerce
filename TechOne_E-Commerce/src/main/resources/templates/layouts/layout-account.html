<!DOCTYPE html>
<html th:fragment="view(title, activeTab, accountContent)"
    th:replace="~{layouts/layout-client :: view(title=${title}, content=~{:: #account-wrapper})}"
    xmlns:th="http://www.thymeleaf.org">

<body>

    <div id="account-wrapper" class="w-full bg-background-light dark:bg-background-dark min-h-screen">

        <div class="max-w-[1440px] mx-auto px-4 sm:px-6 lg:px-8 py-6">
            <nav aria-label="Breadcrumb" class="flex mb-6">
                <ol class="inline-flex items-center space-x-1 md:space-x-3">
                    <li class="inline-flex items-center">
                        <a class="inline-flex items-center text-sm font-medium text-gray-500 hover:text-primary dark:text-gray-400"
                            href="/">
                            <span class="material-symbols-outlined text-[18px] mr-2">home</span>
                            Trang chủ
                        </a>
                    </li>
                    <li>
                        <div class="flex items-center">
                            <span class="material-symbols-outlined text-gray-400">chevron_right</span>
                            <span class="ml-1 text-sm font-medium text-gray-700 md:ml-2 dark:text-gray-200">Tài
                                khoản</span>
                        </div>
                    </li>
                </ol>
            </nav>

            <div class="flex flex-col lg:flex-row gap-8">

                <aside class="w-full lg:w-64 flex-shrink-0 sticky top-24 self-start">
                    <div
                        class="bg-white dark:bg-[#1e293b] rounded-xl p-4 shadow-sm border border-gray-100 dark:border-gray-700">
                        <div class="flex items-center gap-3 mb-6 px-3 py-2">
                            <div class="size-12 rounded-full overflow-hidden bg-gray-200 relative group">
                                <img alt="User avatar" class="w-full h-full object-cover js-user-avatar"
                                    th:src="${session.user.avatar != null ? (session.user.avatar.startsWith('http') ? session.user.avatar : '/images/avatars/' + session.user.avatar) : 'https://ui-avatars.com/api/?name=' + session.user.fullname + '&background=random'}" />
                                <div
                                    class="absolute inset-0 bg-black/30 hidden group-hover:flex items-center justify-center text-white cursor-pointer">
                                    <span class="material-symbols-outlined text-sm">edit</span>
                                </div>
                            </div>
                            <div>
                                <p class="text-xs text-gray-500 dark:text-gray-400">Tài khoản của</p>
                                <p class="font-bold text-[#1c100d] dark:text-white truncate max-w-[140px]"
                                    th:text="${session.user.fullname}">Nguyen Van A
                                </p>
                            </div>
                        </div>

                        <nav class="space-y-1">
                            <a th:href="@{/account}"
                                th:classappend="${activeTab == 'overview'} ? 'bg-primary/10 text-primary' : 'text-gray-600 hover:bg-gray-50 hover:text-[#1c100d] dark:text-gray-300 dark:hover:bg-gray-700 dark:hover:text-white'"
                                class="flex items-center gap-3 px-3 py-2.5 rounded-lg font-medium transition-colors">
                                <span class="material-symbols-outlined">dashboard</span>
                                <span>Tổng quan</span>
                            </a>

                            <a th:href="@{/account/orders}"
                                th:classappend="${activeTab == 'orders'} ? 'bg-primary/10 text-primary' : 'text-gray-600 hover:bg-gray-50 hover:text-[#1c100d] dark:text-gray-300 dark:hover:bg-gray-700 dark:hover:text-white'"
                                class="flex items-center gap-3 px-3 py-2.5 rounded-lg font-medium transition-colors">
                                <span class="material-symbols-outlined">receipt_long</span>
                                <span>Đơn hàng</span>
                            </a>

                            <a th:href="@{/account/address}"
                                th:classappend="${activeTab == 'addresses'} ? 'bg-primary/10 text-primary' : 'text-gray-600 hover:bg-gray-50 hover:text-[#1c100d] dark:text-gray-300 dark:hover:bg-gray-700 dark:hover:text-white'"
                                class="flex items-center gap-3 px-3 py-2.5 rounded-lg font-medium transition-colors">
                                <span class="material-symbols-outlined">location_on</span>
                                <span>Địa chỉ</span>
                            </a>

                            <a th:href="@{/account/favourited}"
                                th:classappend="${activeTab == 'wishlist'} ? 'bg-primary/10 text-primary' : 'text-gray-600 hover:bg-gray-50 hover:text-[#1c100d] dark:text-gray-300 dark:hover:bg-gray-700 dark:hover:text-white'"
                                class="flex items-center gap-3 px-3 py-2.5 rounded-lg font-medium transition-colors">
                                <span class="material-symbols-outlined">favorite</span>
                                <span>Yêu thích</span>
                                <span
                                    class="ml-auto bg-gray-100 text-gray-600 text-xs font-bold px-2 py-0.5 rounded-full dark:bg-gray-600 dark:text-gray-300">5</span>
                            </a>

                            <a th:href="@{/account/vouchers}"
                                th:classappend="${activeTab == 'vouchers'} ? 'bg-primary/10 text-primary' : 'text-gray-600 hover:bg-gray-50 hover:text-[#1c100d] dark:text-gray-300 dark:hover:bg-gray-700 dark:hover:text-white'"
                                class="flex items-center gap-3 px-3 py-2.5 rounded-lg font-medium transition-colors">
                                <span class="material-symbols-outlined">confirmation_number</span>
                                <span>Kho Voucher</span>
                                <span
                                    class="ml-auto bg-gray-100 text-gray-600 text-xs font-bold px-2 py-0.5 rounded-full dark:bg-gray-600 dark:text-gray-300">2</span>
                            </a>

                            <a th:href="@{/account/profile}"
                                th:classappend="${activeTab == 'profile'} ? 'bg-primary/10 text-primary' : 'text-gray-600 hover:bg-gray-50 hover:text-[#1c100d] dark:text-gray-300 dark:hover:bg-gray-700 dark:hover:text-white'"
                                class="flex items-center gap-3 px-3 py-2.5 rounded-lg font-medium transition-colors">
                                <span class="material-symbols-outlined">person</span>
                                <span>Thông tin tài khoản</span>
                            </a>

                            <a th:href="@{/account/change-password}"
                                th:classappend="${activeTab == 'password'} ? 'bg-primary/10 text-primary' : 'text-gray-600 hover:bg-gray-50 hover:text-[#1c100d] dark:text-gray-300 dark:hover:bg-gray-700 dark:hover:text-white'"
                                class="flex items-center gap-3 px-3 py-2.5 rounded-lg font-medium transition-colors">
                                <span class="material-symbols-outlined">lock</span>
                                <span>Đổi mật khẩu</span>
                            </a>

                            <div class="h-px bg-gray-200 dark:bg-gray-700 my-2"></div>

                            <a th:href="@{/logout}"
                                class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-red-500 hover:bg-red-50 dark:hover:bg-red-900/20 transition-colors font-medium">
                                <span class="material-symbols-outlined">logout</span>
                                <span>Đăng xuất</span>
                            </a>
                        </nav>
                    </div>
                </aside>

                <main class="flex-1 min-w-0 min-h-[80vh]" th:insert="${accountContent}"></main>

            </div>
        </div>
    </div>
</body>

</html>
