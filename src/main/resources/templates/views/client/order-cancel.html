<!DOCTYPE html>
<html th:replace="~{layouts/layout-client :: view(title='Thanh toán thất bại', content=~{:: #cancel-content})}">

<body>

    <div id="cancel-content"
        class="w-full bg-background-light dark:bg-background-dark min-h-screen flex flex-col items-center py-8 md:py-12 px-4">

        <section
            class="w-full max-w-4xl bg-white dark:bg-[#1e293b] rounded-3xl shadow-sm border border-gray-100 dark:border-gray-700 p-8 md:p-12 mb-8 relative overflow-hidden text-center">
            <div class="absolute inset-0 opacity-10 pointer-events-none"
                style="background-image: radial-gradient(#6b7280 2px, transparent 2px), radial-gradient(#6b7280 2px, transparent 2px); background-size: 40px 40px; background-position: 0 0, 20px 20px;">
            </div>

            <div class="relative z-10 flex flex-col items-center gap-6">
                <div class="size-24 rounded-full bg-gray-100 dark:bg-gray-800 flex items-center justify-center mb-2">
                    <span class="material-symbols-outlined text-gray-500 text-[64px]">cancel</span>
                </div>
                <div class="space-y-4 max-w-2xl">
                    <h1 class="text-3xl md:text-4xl font-black text-[#1c100d] dark:text-white tracking-tight">
                        Thanh toán đã bị hủy!
                    </h1>
                    <p class="text-gray-500 dark:text-gray-400 text-lg">
                        Giao dịch của bạn đã bị hủy hoặc không thành công. Nếu đây là lỗi, vui lòng thử lại hoặc liên hệ
                        với chúng tôi để được hỗ trợ.
                    </p>
                    <div th:if="${orderCode != null}"
                        class="inline-flex items-center gap-2 px-4 py-2 bg-gray-50 dark:bg-gray-800 rounded-lg border border-gray-200">
                        <span class="text-sm font-medium text-gray-500 dark:text-gray-400">Mã đơn hàng:</span>
                        <span class="text-lg font-bold text-gray-700 dark:text-gray-300"
                            th:text="'#' + ${orderCode}">#000000</span>
                    </div>
                </div>
                <div class="flex flex-wrap gap-4 justify-center w-full mt-4">
                    <a href="/checkout"
                        class="flex items-center justify-center h-12 px-8 rounded-xl bg-primary hover:bg-red-600 text-white font-bold transition-transform active:scale-95 shadow-lg shadow-primary/25 min-w-[200px]">
                        Thử lại thanh toán
                    </a>
                    <a href="/"
                        class="flex items-center justify-center h-12 px-8 rounded-xl bg-transparent border-2 border-gray-200 hover:border-gray-300 text-gray-600 dark:text-gray-400 font-bold transition-all active:scale-95 min-w-[200px]">
                        Quay lại trang chủ
                    </a>
                </div>
            </div>
        </section>

    </div>
</body>

</html>
