<!DOCTYPE html>
<html
    th:replace="~{layouts/layout-admin :: view(title=(${editMode} ? 'Chỉnh sửa bài viết' : 'Thêm bài viết mới'), menuItem='posts', content=~{:: #main-content}, subMenuItem=null)}">

<body>
    <div id="main-content">
        <form id="postForm" th:action="@{/admin/post-list/post-form/save}" th:object="${post}" method="post"
            enctype="multipart/form-data">
            <input type="hidden" th:field="*{id}">
            <input type="hidden" th:field="*{thumbnail}">
            <div class="max-w-7xl mx-auto space-y-6">
                <!-- Header Actions -->
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                    <div class="flex flex-col gap-1">
                        <div class="flex items-center gap-2 text-sm text-gray-500 dark:text-gray-400">
                            <a class="hover:text-primary transition-colors" href="#">Tổng quan</a>
                            <span class="material-symbols-outlined text-[16px]">chevron_right</span>
                            <a class="hover:text-primary transition-colors" href="/admin/post-list">Bài viết</a>
                            <span class="material-symbols-outlined text-[16px]">chevron_right</span>
                            <span class="font-bold text-gray-900 dark:text-white"
                                th:text="${editMode ? 'Chỉnh sửa' : 'Thêm mới'}">Thêm mới</span>
                        </div>
                    </div>
                    <div class="flex items-center gap-3">
                        <button type="submit"
                            class="px-5 py-2.5 rounded bg-primary hover:bg-orange-700 text-white font-bold text-sm shadow-lg shadow-primary/20 transition-all flex items-center gap-2">
                            <span class="material-symbols-outlined text-[20px]">check</span>
                            <span th:text="${editMode ? 'Cập nhật bài viết' : 'Đăng bài viết'}">Đăng bài viết</span>
                        </button>
                    </div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
                    <!-- Main Column -->
                    <div class="lg:col-span-8 space-y-6">
                        <!-- Content Card -->
                        <div
                            class="bg-white dark:bg-gray-800 rounded shadow-sm border border-gray-100 dark:border-gray-700 p-6 space-y-6">
                            <h2
                                class="text-lg font-bold text-gray-900 dark:text-white flex items-center gap-2 border-b border-gray-50 dark:border-gray-700 pb-4">
                                <span class="material-symbols-outlined text-primary">edit_note</span>
                                Nội dung bài viết
                            </h2>

                            <div class="space-y-4">
                                <div class="space-y-1.5">
                                    <label class="block text-sm font-bold text-gray-700 dark:text-gray-300">
                                        Tiêu đề bài viết <span class="text-red-500">*</span>
                                    </label>
                                    <input th:field="*{title}"
                                        class="w-full bg-white dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded py-3 px-4 text-sm font-medium focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all placeholder:text-gray-400 dark:text-white"
                                        placeholder="Nhập tiêu đề hấp dẫn cho bài viết..." type="text" />
                                    <p th:if="${#fields.hasErrors('title')}" th:errors="*{title}"
                                        class="text-red-500 text-[13px] mt-1 font-medium"></p>
                                </div>

                                <div class="space-y-1.5">
                                    <label class="block text-sm font-bold text-gray-700 dark:text-gray-300">Nội dung chi
                                        tiết</label>
                                    <div
                                        class="border border-gray-200 dark:border-gray-600 rounded overflow-hidden bg-white dark:bg-gray-700 focus-within:ring-2 focus-within:ring-primary/20 focus-within:border-primary transition-all text-gray-900">
                                        <textarea th:field="*{content}" id="editor"></textarea>
                                    </div>
                                    <p th:if="${#fields.hasErrors('content')}" th:errors="*{content}"
                                        class="text-red-500 text-[13px] mt-1 font-medium"></p>
                                </div>
                            </div>
                        </div>

                        <!-- Images Card -->
                        <div
                            class="bg-white dark:bg-gray-800 rounded shadow-sm border border-gray-100 dark:border-gray-700 p-6 space-y-4">
                            <h2
                                class="text-lg font-bold text-gray-900 dark:text-white flex items-center gap-2 border-b border-gray-50 dark:border-gray-700 pb-4">
                                <span class="material-symbols-outlined text-primary">image</span>
                                Hình ảnh minh họa (Thumbnail)
                            </h2>
                            <div class="grid grid-cols-2 md:grid-cols-4 gap-4" id="thumbnailPreviewContainer">
                                <!-- Existing thumbnail if any -->
                                <div th:if="${post.thumbnail != null and not #strings.isEmpty(post.thumbnail)}"
                                    class="relative group aspect-square rounded overflow-hidden border border-gray-200">
                                    <img th:src="@{'/images/posts/' + ${post.thumbnail}}"
                                        class="w-full h-full object-cover">
                                    <div
                                        class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                                        <button type="button"
                                            class="bg-red-500 text-white p-2 rounded-full hover:bg-red-600">
                                            <span class="material-symbols-outlined text-[18px]">delete</span>
                                        </button>
                                    </div>
                                </div>
                                <!-- Upload Button Slot -->
                                <label
                                    class="aspect-square rounded border-2 border-dashed border-gray-200 dark:border-gray-700 hover:border-primary hover:bg-primary/5 transition-all flex flex-col items-center justify-center cursor-pointer group"
                                    th:unless="${post.thumbnail != null and not #strings.isEmpty(post.thumbnail)}">
                                    <span
                                        class="material-symbols-outlined text-gray-400 group-hover:text-primary mb-2">add_photo_alternate</span>
                                    <span class="text-xs font-bold text-gray-500 group-hover:text-primary">Tải ảnh
                                        lên</span>
                                    <input type="file" name="thumbnailFile" accept="image/*" class="hidden"
                                        onchange="previewThumbnail(this)">
                                </label>
                            </div>
                            <p th:if="${#fields.hasErrors('thumbnail')}" th:errors="*{thumbnail}"
                                class="text-red-500 text-[13px] mt-1 font-medium"></p>
                        </div>
                    </div>

                    <!-- Side Column -->
                    <div class="lg:col-span-4 space-y-6">
                        <!-- Categorization -->
                        <div
                            class="bg-white dark:bg-gray-800 rounded shadow-sm border border-gray-100 dark:border-gray-700 p-6 space-y-6">
                            <h2
                                class="text-lg font-bold text-gray-900 dark:text-white flex items-center gap-2 border-b border-gray-50 dark:border-gray-700 pb-4">
                                <span class="material-symbols-outlined text-primary">category</span>
                                Phân loại
                            </h2>
                            <div class="space-y-4">
                                <div class="space-y-1.5 relative" id="categoryDropdownContainer">
                                    <label
                                        class="block text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider">Danh
                                        mục bài viết</label>
                                    <input type="hidden" th:field="*{category.id}" id="categoryId">
                                    <button type="button" onclick="toggleCategoryDropdown()"
                                        class="w-full bg-white dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded py-3 px-4 text-sm font-medium focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all text-gray-600 dark:text-white flex justify-between items-center text-left">
                                        <span id="categoryLabel"
                                            th:text="${post.category != null and post.category.name != null ? post.category.name : 'Chọn danh mục...'}">Chọn
                                            danh mục...</span>
                                        <span class="material-symbols-outlined text-[20px] transition-transform"
                                            id="categoryChevron">expand_more</span>
                                    </button>
                                    <div id="categoryMenu"
                                        class="hidden absolute top-full left-0 w-full mt-2 bg-white dark:bg-gray-800 border border-gray-100 dark:border-gray-700 rounded shadow-xl z-50 overflow-hidden">
                                        <ul class="py-1">
                                            <li th:each="cat : ${postCategories}">
                                                <button type="button" th:data-id="${cat.id}" th:data-name="${cat.name}"
                                                    onclick="selectCategory(this.getAttribute('data-id'), this.getAttribute('data-name'))"
                                                    class="w-full text-left px-4 py-3 text-sm hover:bg-primary/5 hover:text-primary transition-colors flex items-center justify-between group">
                                                    <span th:text="${cat.name}">Tên danh mục</span>
                                                    <span
                                                        class="material-symbols-outlined opacity-0 group-hover:opacity-100 text-[18px]">check</span>
                                                </button>
                                            </li>
                                        </ul>
                                    </div>
                                    <p th:if="${#fields.hasErrors('category')}" th:errors="*{category}"
                                        class="text-red-500 text-[13px] mt-1 font-medium"></p>
                                </div>
                            </div>
                        </div>

                        <!-- Status & Schedule -->
                        <div
                            class="bg-white dark:bg-gray-800 rounded shadow-sm border border-gray-100 dark:border-gray-700 p-6 space-y-6">
                            <h2
                                class="text-lg font-bold text-gray-900 dark:text-white flex items-center gap-2 border-b border-gray-50 dark:border-gray-700 pb-4">
                                <span class="material-symbols-outlined text-primary">visibility</span>
                                Trạng thái & Hiển thị
                            </h2>
                            <div class="space-y-4">
                                <div
                                    class="flex items-center justify-between p-4 bg-gray-50 dark:bg-gray-900/50 rounded border border-gray-100 dark:border-gray-700">
                                    <div class="flex flex-col">
                                        <span class="text-sm font-bold text-gray-900 dark:text-white">Xuất bản bài
                                            viết</span>
                                        <span class="text-[11px] text-gray-500">Mọi người có thể thấy bài này</span>
                                    </div>
                                    <label class="inline-flex items-center cursor-pointer relative">
                                        <input type="checkbox" th:field="*{status}" onchange="updateStatusLabel(this)"
                                            class="sr-only peer">
                                        <div
                                            class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer dark:bg-gray-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-primary">
                                        </div>
                                    </label>
                                </div>
                                <div class="flex flex-col gap-3 px-1">
                                    <div class="flex items-center justify-between text-xs">
                                        <span class="text-gray-500 font-medium">Trạng thái hiện tại:</span>
                                        <span id="statusBadge"
                                            class="font-bold flex items-center gap-1.5 px-2 py-1 rounded transition-all"
                                            th:classappend="${post.status} ? 'bg-green-50 text-green-700' : 'bg-amber-50 text-amber-700'">
                                            <span class="w-1.5 h-1.5 rounded-full"
                                                th:classappend="${post.status} ? 'bg-green-500' : 'bg-amber-500'"></span>
                                            <span th:text="${post.status ? 'Đã xuất bản' : 'Tạm ẩn'}"></span>
                                        </span>
                                    </div>
                                    <div class="flex items-center justify-between text-xs">
                                        <span class="text-gray-500 font-medium">Tác giả:</span>
                                        <span class="text-gray-900 dark:text-white font-bold"
                                            th:text="${session.user != null ? session.user.fullname : 'Admin TechShop'}">Admin</span>
                                    </div>
                                    <div class="flex items-center justify-between text-xs">
                                        <span class="text-gray-500 font-medium">Ngày tạo:</span>
                                        <span class="text-gray-900 dark:text-white font-bold"
                                            th:text="${post.createAt != null ? #temporals.format(post.createAt, 'dd/MM/yyyy') : 'Hôm nay'}">Hôm
                                            nay</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </form>

        <style>
            .ck-editor__editable_inline {
                min-height: 400px;
                color: #111827;
            }

            .dark .ck-editor__editable_inline {
                background-color: #374151 !important;
                color: #f9fafb;
            }

            .dark .ck-toolbar {
                background-color: #1f2937 !important;
                border-color: #4b5563 !important;
            }

            .dark .ck-button {
                color: #d1d5db !important;
            }

            .dark .ck-button:hover {
                background-color: #4b5563 !important;
            }
        </style>

        <!-- CDN của CKEditor -->
        <script src="https://cdn.ckeditor.com/ckeditor5/39.0.1/classic/ckeditor.js"></script>

        <script>
            // --- Khởi tạo CKEditor ---
            class CustomUploadAdapter {
                constructor(loader) {
                    this.loader = loader;
                }

                upload() {
                    return this.loader.file
                        .then(file => new Promise((resolve, reject) => {
                            this._initRequest();
                            this._initListeners(resolve, reject, file);
                            this._sendRequest(file);
                        }));
                }

                abort() {
                    if (this.xhr) {
                        this.xhr.abort();
                    }
                }

                _initRequest() {
                    const xhr = this.xhr = new XMLHttpRequest();
                    // Đích gửi ảnh đến Controller mới tạo
                    xhr.open('POST', '/api/upload/ckeditor', true);
                    xhr.responseType = 'json';
                }

                _initListeners(resolve, reject, file) {
                    const xhr = this.xhr;
                    const loader = this.loader;
                    const genericErrorText = `Không thể tải lên tệp: ${file.name}.`;

                    xhr.addEventListener('error', () => reject(genericErrorText));
                    xhr.addEventListener('abort', () => reject());
                    xhr.addEventListener('load', () => {
                        const response = xhr.response;
                        if (!response || response.error) {
                            return reject(response && response.error ? response.error.message : genericErrorText);
                        }
                        resolve({
                            default: response.url
                        });
                    });

                    if (xhr.upload) {
                        xhr.upload.addEventListener('progress', evt => {
                            if (evt.lengthComputable) {
                                loader.uploadTotal = evt.total;
                                loader.uploaded = evt.loaded;
                            }
                        });
                    }
                }

                _sendRequest(file) {
                    const data = new FormData();
                    data.append('upload', file);
                    this.xhr.send(data);
                }
            }

            function CustomUploadAdapterPlugin(editor) {
                editor.plugins.get('FileRepository').createUploadAdapter = (loader) => {
                    return new CustomUploadAdapter(loader);
                };
            }

            ClassicEditor
                .create(document.querySelector('#editor'), {
                    extraPlugins: [CustomUploadAdapterPlugin],
                    toolbar: {
                        items: [
                            'heading', '|',
                            'bold', 'italic', 'link', 'bulletedList', 'numberedList', '|',
                            'outdent', 'indent', '|',
                            'imageUpload', 'blockQuote', 'insertTable', 'mediaEmbed', 'undo', 'redo'
                        ]
                    },
                    image: {
                        toolbar: [
                            'imageTextAlternative', 'toggleImageCaption', 'imageStyle:inline', 'imageStyle:block', 'imageStyle:side'
                        ]
                    },
                    language: 'vi'
                })
                .catch(error => {
                    console.error(error);
                });

            // --- Dropdown Logic ---
            function toggleCategoryDropdown() {
                const menu = document.getElementById('categoryMenu');
                const chevron = document.getElementById('categoryChevron');
                menu.classList.toggle('hidden');
                chevron.style.transform = menu.classList.contains('hidden') ? 'rotate(0deg)' : 'rotate(180deg)';
            }

            function selectCategory(id, name) {
                document.getElementById('categoryId').value = id;
                document.getElementById('categoryLabel').innerText = name;
                document.getElementById('categoryLabel').classList.add('text-gray-900', 'font-bold');
                toggleCategoryDropdown();
            }

            // --- UI Updates ---
            function updateStatusLabel(checkbox) {
                const badge = document.getElementById('statusBadge');
                if (checkbox.checked) {
                    badge.className = 'font-bold flex items-center gap-1.5 px-2 py-1 rounded bg-green-50 text-green-700 transition-all';
                    badge.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-green-500"></span> Đã xuất bản';
                } else {
                    badge.className = 'font-bold flex items-center gap-1.5 px-2 py-1 rounded bg-amber-50 text-amber-700 transition-all';
                    badge.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span> Tạm ẩn';
                }
            }

            function previewThumbnail(input) {
                const container = document.getElementById('thumbnailPreviewContainer');
                const label = container.querySelector('label');

                if (input.files && input.files[0]) {
                    const file = input.files[0];
                    const reader = new FileReader();

                    reader.onload = (e) => {
                        // Create preview element
                        const wrapper = document.createElement('div');
                        wrapper.className = 'relative group aspect-square rounded overflow-hidden border border-gray-100 shadow-sm';
                        wrapper.id = 'thumbnailPreviewElement';
                        wrapper.innerHTML = `
            <img src="${e.target.result}" class="w-full h-full object-cover">
                <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                    <button type="button" class="bg-red-500 text-white p-2 rounded-full hover:bg-red-600 transition-transform active:scale-95" onclick="removeThumbnail()">
                        <span class="material-symbols-outlined text-[18px]">delete</span>
                    </button>
                </div>
                        `;

                        // Remove existing preview if any, and hide label
                        const existingPreview = document.getElementById('thumbnailPreviewElement');
                        if (existingPreview) existingPreview.remove();
                        if (label) label.style.display = 'none';

                        container.insertBefore(wrapper, container.firstChild);
                    };
                    reader.readAsDataURL(file);
                }
            }

            function removeThumbnail() {
                const preview = document.getElementById('thumbnailPreviewElement');
                const label = document.getElementById('thumbnailPreviewContainer').querySelector('label');
                const input = document.querySelector('input[name="thumbnailFile"]');

                if (preview) preview.remove();
                if (label) label.style.display = 'flex';
                if (input) input.value = '';
            }

            // Outside click to close dropdowns
            document.addEventListener('click', (e) => {
                const container = document.getElementById('categoryDropdownContainer');
                if (container && !container.contains(e.target)) {
                    document.getElementById('categoryMenu').classList.add('hidden');
                    document.getElementById('categoryChevron').style.transform = 'rotate(0deg)';
                }
            });

            // Khong can link textarea nua vi CKEditor auto-sync
        </script>
    </div>
</body>

</html>
