<!DOCTYPE html>
<html th:replace="~{layouts/layout-authentic :: view(title='Đăng ký', content=~{::content})}"
    xmlns:th="http://www.thymeleaf.org">
<div th:fragment="content">
    <div class="mb-8 text-center">
        <h1 class="text-2xl font-bold leading-tight tracking-tight text-[#1c100d] dark:text-white mb-2">Đăng
            ký</h1>
        <p class="text-sm text-gray-500 dark:text-gray-400">Điền thông tin bên dưới để bắt đầu</p>
    </div>

    <div th:if="${error}"
        class="mb-4 p-4 text-sm text-red-800 bg-red-50 dark:bg-gray-800 dark:text-red-400 rounded-lg border border-red-200 flex items-center gap-2">
        <span class="material-symbols-outlined text-[20px]">error</span>
        <span th:text="${error}"></span>
    </div>

    <form class="flex flex-col gap-5" id="registerForm" th:action="@{/register}" th:object="${account}" method="post">

        <div class="flex flex-col gap-1.5">
            <label class="text-[#1c100d] dark:text-gray-200 text-sm font-semibold">Họ và tên</label>
            <div class="relative group">
                <span
                    class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-primary transition-colors text-[20px]">person</span>
                <input name="fullname" th:field="*{fullname}"
                    class="w-full h-12 pl-11 pr-4 rounded-lg border border-[#e9d4ce] dark:border-gray-700 bg-gray-50 dark:bg-[#2a1712] text-[#1c100d] dark:text-white placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary focus:bg-white dark:focus:bg-[#2a1712] text-sm transition-all"
                    placeholder="Nguyễn Văn A" type="text" />
                <p class="text-xs text-red-500 mt-1" th:if="${#fields.hasErrors('fullname')}" th:errors="*{fullname}">
                </p>
            </div>
        </div>

        <div class="flex flex-col gap-1.5">
            <label class="text-[#1c100d] dark:text-gray-200 text-sm font-semibold">Mật khẩu</label>
            <div class="relative group">
                <span
                    class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-primary transition-colors text-[20px]">lock</span>
                <input name="password" th:field="*{password}"
                    class="w-full h-12 pl-11 pr-12 rounded-lg border border-[#e9d4ce] dark:border-gray-700 bg-gray-50 dark:bg-[#2a1712] text-[#1c100d] dark:text-white placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary focus:bg-white dark:focus:bg-[#2a1712] text-sm transition-all"
                    id="password" placeholder="••••••••" type="password" />
                <p class="text-xs text-red-500 mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">
                </p>
                <button
                    class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-primary transition-colors flex items-center justify-center focus:outline-none"
                    id="togglePassword" type="button">
                    <span class="material-symbols-outlined text-[20px]">visibility_off</span>
                </button>
            </div>
            <div class="flex gap-1 h-1 mt-1 hidden" id="passwordStrength">
                <div class="h-full w-1/3 rounded-full bg-gray-200 dark:bg-gray-700 transition-colors duration-300"
                    id="strength-bar-1"></div>
                <div class="h-full w-1/3 rounded-full bg-gray-200 dark:bg-gray-700 transition-colors duration-300"
                    id="strength-bar-2"></div>
                <div class="h-full w-1/3 rounded-full bg-gray-200 dark:bg-gray-700 transition-colors duration-300"
                    id="strength-bar-3"></div>
            </div>
            <p class="text-xs text-gray-500 mt-0.5 hidden" id="strength-text">Độ mạnh: <span class="font-medium">Chưa
                    nhập</span></p>
        </div>

        <div class="flex flex-col gap-1.5">
            <label id="input-label" class="text-[#1c100d] dark:text-gray-200 text-sm font-semibold">Email</label>
            <div class="relative group">
                <span id="input-icon"
                    class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-primary transition-colors text-[20px]">mail</span>
                <input id="contact-input" name="contact" th:field="*{contact}"
                    class="w-full h-12 pl-11 pr-4 rounded-lg border border-[#e9d4ce] dark:border-gray-700 bg-gray-50 dark:bg-[#2a1712] text-[#1c100d] dark:text-white placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary focus:bg-white dark:focus:bg-[#2a1712] text-sm transition-all"
                    placeholder="email@example.com" type="email" />
                <p class="text-red-500 text-xs mt-1" th:if="${#fields.hasErrors('contact')}" th:errors="*{contact}"></p>
            </div>
        </div>

        <div class="flex items-center gap-4 mt-1">
            <span class="text-[#1c100d] dark:text-gray-200 text-sm font-semibold">Đăng ký bằng:</span>
            <div class="flex gap-6 items-center">
                <label class="flex items-center gap-2 cursor-pointer group">
                    <input type="radio" name="register_method" value="email" checked
                        class="w-4 h-4 text-primary border-gray-300 focus:ring-primary cursor-pointer">
                    <span
                        class="text-sm font-medium text-gray-700 dark:text-gray-300 group-hover:text-primary transition-colors">Email</span>
                </label>
                <label class="flex items-center gap-2 cursor-pointer group">
                    <input type="radio" name="register_method" value="phone"
                        class="w-4 h-4 text-primary border-gray-300 focus:ring-primary cursor-pointer">
                    <span
                        class="text-sm font-medium text-gray-700 dark:text-gray-300 group-hover:text-primary transition-colors">Số
                        điện thoại</span>
                </label>
            </div>
        </div>

        <label class="flex items-center gap-3 cursor-pointer mt-2 group">
            <div class="relative flex items-center">
                <input id="termsCheckbox"
                    class="peer size-5 cursor-pointer appearance-none rounded border border-gray-300 dark:border-gray-600 checked:bg-primary checked:border-primary transition-all bg-white dark:bg-transparent"
                    type="checkbox" />
                <span
                    class="material-symbols-outlined absolute text-white opacity-0 peer-checked:opacity-100 top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 pointer-events-none text-[16px]">check</span>
            </div>
            <span class="text-sm text-gray-600 dark:text-gray-300 leading-tight">
                Tôi đồng ý với <a
                    class="text-primary hover:text-[#d63a0e] hover:underline font-medium transition-colors"
                    href="#">Điều khoản dịch vụ</a> và <a
                    class="text-primary hover:text-[#d63a0e] hover:underline font-medium transition-colors"
                    href="#">Chính sách bảo mật</a>
            </span>
        </label>
        <button id="registerButton"
            class="w-full h-12 mt-2 bg-primary hover:bg-[#ff6b42] text-white font-bold rounded-lg shadow-lg shadow-primary/30 transition-all active:scale-[0.98] flex items-center justify-center gap-2 disabled:opacity-70 disabled:cursor-not-allowed">
            <svg class="animate-spin -ml-1 mr-2 h-5 w-5 text-white hidden" id="registerSpinner"
                xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
                </circle>
                <path class="opacity-75" fill="currentColor"
                    d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                </path>
            </svg>
            <span id="registerButtonText">Xác thực</span>
            <span id="registerButtonIcon" class="material-symbols-outlined text-[20px]">arrow_forward</span>
        </button>
    </form>

    <div class="relative flex py-8 items-center">
        <div class="flex-grow border-t border-gray-200 dark:border-gray-700"></div>
        <span class="flex-shrink-0 mx-4 text-gray-400 text-xs uppercase font-semibold tracking-wider">Hoặc
            đăng ký bằng</span>
        <div class="flex-grow border-t border-gray-200 dark:border-gray-700"></div>
    </div>
    <div class="grid grid-cols-1 gap-4">
        <a th:href="@{/oauth2/authorization/google}" id="googleButton"
            class="flex items-center justify-center gap-3 h-12 rounded-lg border border-gray-200 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-white/5 hover:border-gray-400 dark:hover:border-gray-500 hover:shadow-md transition-all font-medium text-sm text-[#1c100d] dark:text-white bg-white dark:bg-transparent disabled:opacity-50 disabled:cursor-not-allowed">
            <svg class="size-5" fill="none" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path
                    d="M21.8055 10.0415H21V10H12V14H17.6515C16.827 16.3285 14.6115 18 12 18C8.6865 18 6 15.3135 6 12C6 8.6865 8.6865 6 12 6C13.5295 6 14.921 6.577 15.9805 7.5195L18.809 4.691C17.023 3.0265 14.634 2 12 2C6.4775 2 2 6.4775 2 12C2 17.5225 6.4775 22 12 22C17.5225 22 22 17.5225 22 12C22 11.3295 21.931 10.675 21.8055 10.0415Z"
                    fill="#FFC107"></path>
                <path
                    d="M3.15295 7.3455L6.43845 9.755C7.32745 7.554 9.48045 6 12 6C13.5295 6 14.921 6.577 15.9805 7.5195L18.809 4.691C17.023 3.0265 14.634 2 12 2C8.15895 2 4.82795 4.1685 3.15295 7.3455Z"
                    fill="#FF3D00"></path>
                <path
                    d="M12 22C14.6605 22 17.0715 20.9455 18.8585 19.245L15.8285 16.6395C14.7355 17.5025 13.4355 18 12 18C9.36295 18 7.12945 16.3015 6.30845 13.9395L3.06445 16.427C4.73545 19.7435 8.11795 22 12 22Z"
                    fill="#4CAF50"></path>
                <path
                    d="M21.8055 10.0415H21V10H12V14H17.6515C17.257 15.108 16.6205 16.039 15.8285 16.6395L18.8585 19.245C20.673 17.564 21.685 15.2285 21.9365 12.7755C21.979 12.3535 22 11.921 22 11.4885C22 10.9985 21.935 10.514 21.8055 10.0415Z"
                    fill="#1976D2"></path>
            </svg>
            Google
        </a>
    </div>
    <div class="mt-8 text-center">
        <p class="text-sm text-gray-500 dark:text-gray-400">
            Đã có tài khoản?
            <a th:href="@{/login}"
                class="text-primary font-bold hover:text-[#d63a0e] hover:underline transition-colors">Đăng
                nhập</a>
        </p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const methodRadios = document.querySelectorAll('input[name="register_method"]');
            const inputLabel = document.getElementById('input-label');
            const inputIcon = document.getElementById('input-icon');
            const contactInput = document.getElementById('contact-input');

            function updateInput(method) {
                if (method === 'email') {
                    inputLabel.textContent = 'Email';
                    inputIcon.textContent = 'mail';
                    contactInput.type = 'email';
                    contactInput.placeholder = 'email@example.com';
                } else {
                    inputLabel.textContent = 'Số điện thoại';
                    inputIcon.textContent = 'call';
                    contactInput.type = 'tel';
                    contactInput.placeholder = '090 123 4567';
                }
            }

            methodRadios.forEach(radio => {
                radio.addEventListener('change', function () {
                    if (this.checked) {
                        updateInput(this.value);
                    }
                });
            });

            // Initial update based on the checked radio button
            methodRadios.forEach(radio => {
                if (radio.checked) {
                    updateInput(radio.value);
                }
            });

            // Toggle Password Logic
            // Toggle Password Logic
            const togglePasswordBtn = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('password');

            if (togglePasswordBtn && passwordInput) {
                togglePasswordBtn.addEventListener('click', function () {
                    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                    passwordInput.setAttribute('type', type);

                    const icon = this.querySelector('.material-symbols-outlined');
                    if (icon) {
                        icon.textContent = type === 'password' ? 'visibility_off' : 'visibility';
                    }
                });
            }

            // Processing Submit Loading State
            const registerForm = document.getElementById('registerForm');
            const registerButton = document.getElementById('registerButton');
            const registerSpinner = document.getElementById('registerSpinner');
            const registerButtonText = document.getElementById('registerButtonText');
            const registerButtonIcon = document.getElementById('registerButtonIcon');

            if (registerForm) {
                registerForm.addEventListener('submit', function (e) {
                    // e.preventDefault(); // Uncomment if you want to prevent actual submission for testing
                    registerButton.disabled = true;
                    registerSpinner.classList.remove('hidden');
                    registerButtonIcon.classList.add('hidden');
                    registerButtonText.textContent = 'Đang đăng ký...';
                });
            }

            // Password Strength Meter
            if (passwordInput) {
                const strengthBarContainer = document.getElementById('passwordStrength');
                const strengthTextContainer = document.getElementById('strength-text');
                const bars = [
                    document.getElementById('strength-bar-1'),
                    document.getElementById('strength-bar-2'),
                    document.getElementById('strength-bar-3')
                ];

                passwordInput.addEventListener('input', function () {
                    const password = this.value;
                    if (password.length > 0) {
                        strengthBarContainer.classList.remove('hidden');
                        strengthTextContainer.classList.remove('hidden');
                    } else {
                        strengthBarContainer.classList.add('hidden');
                        strengthTextContainer.classList.add('hidden');
                        return;
                    }

                    let strength = 0;
                    if (password.length > 0) strength = 1; // Basic presence
                    if (password.length > 7 && (/[A-Z]/.test(password) || /[0-9]/.test(password))) strength = 2; // Medium
                    if (password.length > 7 && /[A-Z]/.test(password) && /[0-9]/.test(password) && /[^A-Za-z0-9]/.test(password)) strength = 3; // Strong

                    // Reset
                    bars.forEach(bar => {
                        bar.className = 'h-full w-1/3 rounded-full bg-gray-200 dark:bg-gray-700 transition-colors duration-300';
                    });

                    let color = 'bg-red-500';
                    let text = 'Yếu';

                    if (strength === 3) {
                        color = 'bg-green-500';
                        text = 'Mạnh';
                    } else if (strength === 2) {
                        color = 'bg-yellow-400';
                        text = 'Trung bình';
                    }

                    // Fill bars
                    for (let i = 0; i < strength; i++) {
                        bars[i].classList.remove('bg-gray-200', 'dark:bg-gray-700');
                        bars[i].classList.add(color);
                    }

                    strengthTextContainer.innerHTML = `Độ mạnh: <span class="font-medium ${color.replace('bg-', 'text-')}">${text}</span>`;
                });
            }

            // Terms Checkbox Logic
            const termsCheckbox = document.getElementById('termsCheckbox');
            const googleButton = document.getElementById('googleButton');

            if (termsCheckbox) {
                function toggleButtons() {
                    if (termsCheckbox.checked) {
                        if (registerButton) {
                            registerButton.disabled = false;
                            registerButton.classList.remove('opacity-70', 'cursor-not-allowed', 'bg-gray-400');
                            registerButton.classList.add('bg-primary', 'hover:bg-[#ff6b42]', 'shadow-lg');
                        }
                        if (googleButton) {
                            googleButton.disabled = false;
                            googleButton.classList.remove('opacity-50', 'cursor-not-allowed');
                        }

                    } else {
                        if (registerButton) {
                            registerButton.disabled = true;
                            registerButton.classList.add('opacity-70', 'cursor-not-allowed');
                        }
                        if (googleButton) {
                            googleButton.disabled = true;
                            googleButton.classList.add('opacity-50', 'cursor-not-allowed');
                        }
                    }
                }

                // Initial check
                toggleButtons();

                termsCheckbox.addEventListener('change', toggleButtons);
            }
        });
    </script>
</div>

</html>
