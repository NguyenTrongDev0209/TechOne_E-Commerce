<!DOCTYPE html>
<html th:replace="~{layouts/layout-authentic :: view(title='Quên mật khẩu - TechShop', content=~{::content})}"
    xmlns:th="http://www.thymeleaf.org">
<div th:fragment="content">
    <div id="forgot-password-section" class="flex flex-col gap-6">
        <div class="text-center">
            <h1 class="text-[#1c100d] dark:text-white text-2xl font-bold leading-tight mb-2">Quên mật khẩu?</h1>
            <p class="text-sm text-gray-500 dark:text-gray-400">
                Nhập thông tin bên dưới để nhận liên kết đặt lại mật khẩu.
            </p>
        </div>
        <div th:if="${error}"
            class="p-3 mb-4 text-sm text-red-800 rounded-lg bg-red-50 dark:bg-gray-800 dark:text-red-400" role="alert">
            <span th:text="${error}">Error message</span>
        </div>
        <form class="flex flex-col gap-5" th:action="@{/forgot-password}" method="POST" id="main-form">
            <div class="flex flex-col gap-1.5">
                <label class="text-sm font-semibold text-[#1c100d] dark:text-[#e9d4ce]" id="input-label"
                    for="contact-input">Email</label>
                <div class="relative group">
                    <span id="input-icon"
                        class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-primary transition-colors text-[20px]">mail</span>
                    <input
                        class="w-full h-12 pl-11 pr-4 rounded-lg border border-[#e9d4ce] dark:border-gray-700 bg-gray-50 dark:bg-[#2a1712] text-[#1c100d] dark:text-white placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary focus:bg-white dark:focus:bg-[#2a1712] text-sm transition-all"
                        id="contact-input" name="email" placeholder="nguoidung@example.com" type="email" required />
                </div>
            </div>

            <div class="flex items-center gap-4 mt-1">
                <span class="text-[#1c100d] dark:text-gray-200 text-sm font-semibold">Xác thực bằng:</span>
                <div class="flex gap-6 items-center">
                    <label class="flex items-center gap-2 cursor-pointer group">
                        <input type="radio" name="auth_method" value="email" checked
                            class="w-4 h-4 text-primary border-gray-300 focus:ring-primary cursor-pointer">
                        <span
                            class="text-sm font-medium text-gray-700 dark:text-gray-300 group-hover:text-primary transition-colors">Email</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer group">
                        <input type="radio" name="auth_method" value="phone"
                            class="w-4 h-4 text-primary border-gray-300 focus:ring-primary cursor-pointer">
                        <span
                            class="text-sm font-medium text-gray-700 dark:text-gray-300 group-hover:text-primary transition-colors">Số
                            điện thoại</span>
                    </label>
                </div>
            </div>

            <button type="submit" id="submit-btn"
                class="w-full h-12 mt-2 bg-primary hover:bg-[#ff6b42] text-white font-bold rounded-lg shadow-lg shadow-primary/30 transition-all active:scale-[0.98] flex items-center justify-center gap-2">
                <span id="submit-text">Tiếp tục</span>
                <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
            </button>
        </form>
        <div class="flex items-center justify-center pt-2">
            <a th:href="@{/login}"
                class="group flex items-center gap-2 text-gray-500 hover:text-primary transition-all text-sm font-bold">
                <span
                    class="material-symbols-outlined text-lg transition-transform group-hover:-translate-x-1">arrow_back</span>
                Quay lại đăng nhập
            </a>
        </div>
    </div>

    <!-- OTP Section (Hidden by default) -->
    <div id="otp-section" class="hidden flex flex-col gap-6">
        <div class="text-center">
            <h1 class="text-[#1c100d] dark:text-white text-2xl font-bold leading-tight mb-2">Xác nhận OTP</h1>
            <p class="text-sm text-gray-500 dark:text-gray-400">
                Chúng tôi đã gửi mã xác nhận đến <span class="font-semibold text-primary" id="display-contact"></span>
            </p>
        </div>

        <div class="flex justify-between gap-2 sm:gap-3" id="otp-inputs">
            <input maxlength="1" type="text" pattern="\d*" inputmode="numeric"
                class="otp-input w-full aspect-square text-center text-2xl font-bold bg-gray-50 dark:bg-[#1a0f0d] border border-gray-200 dark:border-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all caret-primary text-[#1c100d] dark:text-white" />
            <input maxlength="1" type="text" pattern="\d*" inputmode="numeric"
                class="otp-input w-full aspect-square text-center text-2xl font-bold bg-gray-50 dark:bg-[#1a0f0d] border border-gray-200 dark:border-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all caret-primary text-[#1c100d] dark:text-white" />
            <input maxlength="1" type="text" pattern="\d*" inputmode="numeric"
                class="otp-input w-full aspect-square text-center text-2xl font-bold bg-gray-50 dark:bg-[#1a0f0d] border border-gray-200 dark:border-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all caret-primary text-[#1c100d] dark:text-white" />
            <input maxlength="1" type="text" pattern="\d*" inputmode="numeric"
                class="otp-input w-full aspect-square text-center text-2xl font-bold bg-gray-50 dark:bg-[#1a0f0d] border border-gray-200 dark:border-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all caret-primary text-[#1c100d] dark:text-white" />
            <input maxlength="1" type="text" pattern="\d*" inputmode="numeric"
                class="otp-input w-full aspect-square text-center text-2xl font-bold bg-gray-50 dark:bg-[#1a0f0d] border border-gray-200 dark:border-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all caret-primary text-[#1c100d] dark:text-white" />
            <input maxlength="1" type="text" pattern="\d*" inputmode="numeric"
                class="otp-input w-full aspect-square text-center text-2xl font-bold bg-gray-50 dark:bg-[#1a0f0d] border border-gray-200 dark:border-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all caret-primary text-[#1c100d] dark:text-white" />
        </div>

        <div class="flex flex-col items-center gap-2">
            <div class="text-sm font-medium text-gray-500 dark:text-gray-400">
                Mã hết hạn sau <span class="font-mono font-bold text-primary" id="countdown">04:59</span>
            </div>
            <button class="text-primary font-semibold text-sm hover:underline disabled:opacity-50" id="resend-otp"
                disabled>Gửi lại mã</button>
        </div>

        <button id="verify-btn"
            class="w-full h-12 bg-primary hover:bg-[#ff6b42] text-white font-bold rounded-lg shadow-lg shadow-primary/30 transition-all active:scale-[0.98] flex items-center justify-center gap-2">
            <span id="verify-text">Xác nhận mã OTP</span>
        </button>

        <button onclick="location.reload()"
            class="text-sm text-gray-500 hover:text-primary font-medium text-center">Quay lại</button>
    </div>

    <div id="recaptcha-container"></div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>

    <script th:inline="javascript">
        // Cấu hình Firebase - USER CẦN ĐIỀN THÔNG TIN NÀY
        const firebaseConfig = {
        		apiKey: "AIzaSyDcGsegDytC4NqWJoA9Eo6ytJI7OXRSuFI",
        		  authDomain: "techone-ecommerce-e1999.firebaseapp.com",
        		  projectId: "techone-ecommerce-e1999",
        		  storageBucket: "techone-ecommerce-e1999.firebasestorage.app",
        		  messagingSenderId: "161505511304",
        		  appId: "1:161505511304:web:49511e35438a3a56d95c3d",
        		  measurementId: "G-5E8D9E2N8L"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        document.addEventListener('DOMContentLoaded', function () {
            const mainForm = document.getElementById('main-form');
            const forgotSection = document.getElementById('forgot-password-section');
            const otpSection = document.getElementById('otp-section');
            const displayContact = document.getElementById('display-contact');
            const methodRadios = document.querySelectorAll('input[name="auth_method"]');
            const inputLabel = document.getElementById('input-label');
            const inputIcon = document.getElementById('input-icon');
            const contactInput = document.getElementById('contact-input');
            const submitBtn = document.getElementById('submit-btn');
            const submitText = document.getElementById('submit-text');
            const otpInputs = document.querySelectorAll('.otp-input');
            const countdownEl = document.getElementById('countdown');
            const resendBtn = document.getElementById('resend-otp');
            const verifyBtn = document.getElementById('verify-btn');
            const verifyText = document.getElementById('verify-text');

            let confirmationResult = null;
            let timer = null;

            // ReCAPTCHA
            window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', {
                'size': 'invisible'
            });

            function startTimer(duration) {
                let timeLeft = duration;
                clearInterval(timer);
                resendBtn.disabled = true;
                timer = setInterval(() => {
                    const min = Math.floor(timeLeft / 60);
                    const sec = timeLeft % 60;
                    countdownEl.textContent = `${min.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
                    if (--timeLeft < 0) {
                        clearInterval(timer);
                        resendBtn.disabled = false;
                    }
                }, 1000);
            }

            function normalizePhone(phone) {
                if (phone.startsWith('0')) {
                    return '+84' + phone.slice(1);
                }
                return phone;
            }

            methodRadios.forEach(radio => {
                radio.addEventListener('change', function () {
                    if (this.value === 'email') {
                        inputLabel.textContent = 'Email';
                        inputIcon.textContent = 'mail';
                        contactInput.type = 'email';
                        contactInput.placeholder = 'nguoidung@example.com';
                    } else {
                        inputLabel.textContent = 'Số điện thoại';
                        inputIcon.textContent = 'call';
                        contactInput.type = 'tel';
                        contactInput.placeholder = '09... hoặc +84...';
                    }
                });
            });

            // OTP Input focus logic
            otpInputs.forEach((input, index) => {
                input.addEventListener('input', (e) => {
                    if (e.target.value.length === 1 && index < otpInputs.length - 1) {
                        otpInputs[index + 1].focus();
                    }
                });
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && !e.target.value && index > 0) {
                        otpInputs[index - 1].focus();
                    }
                });
            });

            mainForm.addEventListener('submit', function (e) {
                const method = mainForm.querySelector('input[name="auth_method"]:checked').value;
                const contact = contactInput.value;

                if (method === 'phone') {
                    e.preventDefault();
                    submitBtn.disabled = true;
                    submitText.textContent = "Đang kiểm tra tài khoản...";

                    // 1. Kiểm tra tài khoản tồn tại trên Server trước
                    const formData = new FormData();
                    formData.append("email", contact);
                    formData.append("auth_method", "phone");

                    fetch('/forgot-password', {
                        method: 'POST',
                        body: new URLSearchParams(formData)
                    }).then(response => {
                        if (response.redirected && response.url.includes('confirm-otp')) {
                            // Tài khoản hợp lệ, gửi OTP Firebase
                            submitText.textContent = "Đang gửi mã OTP...";
                            const finalPhone = normalizePhone(contact);

                            return firebase.auth().signInWithPhoneNumber(finalPhone, window.recaptchaVerifier);
                        } else {
                            // Lỗi (có thể tài khoản không tồn tại) - Cần reload để hiện thông báo từ Server hoặc xử lý tại đây
                            location.reload();
                            throw new Error("Tài khoản không hợp lệ");
                        }
                    }).then(result => {
                        confirmationResult = result;
                        forgotSection.classList.add('hidden');
                        otpSection.classList.remove('hidden');
                        displayContact.textContent = contact;
                        startTimer(299);
                    }).catch(error => {
                        console.error(error);
                        if (error.message !== "Tài khoản không hợp lệ") alert("Lỗi: " + error.message);
                        submitBtn.disabled = false;
                        submitText.textContent = "Tiếp tục";
                    });
                }
            });

            const verifyUrl = /*[[@{/confirm-otp/api/verify-success}]]*/ '/confirm-otp/api/verify-success';

            verifyBtn.addEventListener('click', function () {
                let otp = "";
                otpInputs.forEach(i => otp += i.value);
                if (otp.length < 6) return alert("Vui lòng nhập đủ 6 số");

                verifyBtn.disabled = true;
                verifyText.textContent = "Đang xác thực...";

                confirmationResult.confirm(otp).then(() => {
                    // Xác thực thành công ở Firebase, báo cho Server
                    return fetch(verifyUrl, { method: 'POST' });
                }).then(response => {
                    if (response.ok) {
                        window.location.href = /*[[@{/reset-password}]]*/ "/reset-password";
                    } else {
                        console.error("Server verify failed", response.status);
                        alert("Lỗi xác nhận phiên làm việc. Vui lòng thử lại.");
                        location.reload();
                    }
                }).catch(error => {
                    alert("Mã OTP không chính xác!");
                    verifyBtn.disabled = false;
                    verifyText.textContent = "Xác nhận mã OTP";
                });
            });
        });
    </script>
</div>

</html>
